# dnf-automatic config for the dashboard box (alpha-engine-config-I4493).
#
# The box had NO automated patching and 53 days of uptime. Its package set
# happened to be current, which made the exposure easy to miss: patching was
# INCIDENTAL (a side effect of manual sessions), not guaranteed. Nothing
# scheduled it and nothing alerted when it lapsed.
#
# Security-only by design. This box hosts eight products and a full
# `upgrade_type = default` would pull feature updates into Python, Node and
# nginx unattended — on a host whose services were only just given calibrated
# memory ceilings. Security updates are the part that must not wait; everything
# else can ride a deliberate upgrade.
#
# Installed to /etc/dnf/automatic.conf by install-auto-patching.sh.
# Policy: nous-ergon-ops/policies/shared-application-host-policy.md T1-5.

[commands]
upgrade_type = security
random_sleep = 300

# Apply, do not merely download. A download-only config produces the illusion
# of patching -- the updates sit on disk and the box stays vulnerable.
download_updates = yes
apply_updates = yes

# `needs-restarting -r` drives the separate reboot-if-needed.timer instead.
# dnf-automatic has no conditional-reboot option, and an unconditional one on a
# box serving eight products is not acceptable.
reboot = never

[emitters]
# stdio only -> systemd journal. The alerting path is the unit's OnFailure=
# handler plus the reboot-if-needed job, both of which reach SNS/Telegram; a
# second email channel here would be an unmonitored one.
emit_via = stdio

[base]
debuglevel = 1
