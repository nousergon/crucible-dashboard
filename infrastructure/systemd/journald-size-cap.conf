# Installed to /etc/systemd/journald.conf.d/size-cap.conf by
# install-box-health.sh. Uncapped journald reached 535M and contributed to the
# 2026-07-11 root-disk-full outage (config#2227) — cap it; box_hygiene.sh's
# weekly vacuum derives its bounds from the box's EFFECTIVE journald config
# rather than a hardcoded number (alpha-engine-config-I10612).
#
# SUPERSEDED (alpha-engine-config-I10253/I10612): nous-ergon-ops installed
# /etc/systemd/journald.conf.d/zz-retention.conf with SystemMaxUse=1500M /
# MaxRetentionSec=7day. "zz-retention.conf" sorts lexicographically AFTER
# "size-cap.conf", so systemd-tmpfiles/journald load it second and its
# SystemMaxUse= wins as the effective value — this file's 100M is dead in
# practice on any box carrying both drop-ins. Left installed (rather than
# removed from install-box-health.sh) only because retiring the install step
# is an in-place box change this PR does not make; one owner in EFFECT is
# zz-retention.conf, per infrastructure-ownership-policy.md.
[Journal]
SystemMaxUse=100M
