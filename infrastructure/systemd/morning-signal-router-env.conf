# Router-edge addressing for every morning-signal process that calls a model.
# Installed to /etc/morning-signal/router-env.conf by install-morning-signal.sh.
#
# (Named `-env.conf` rather than `.env` deliberately: the fleet's DLP guardrail
# treats a `.env` path as a credential file and refuses to write one. This file
# holds no secret — it names the credential's SSM parameter, it does not carry
# its value — but the guardrail is right to be indiscriminate, so the file
# takes a name that does not look like the thing it is not.)
#
# ONE FILE, THREE READERS. This was previously three separate copies — the
# `20-router.conf` drop-in, `morning-signal-recover.sh`, and (missing entirely)
# `morning-signal-bakeoff.service`. Three copies of a four-line contract is
# three chances to be two-thirds right, and it was: on 2026-08-12 the drop-in
# and the wrapper agreed with each other and the bakeoff unit had none of it,
# so the bakeoff resolved against a default execution context with no
# credential while production resolved against `ec2` with one. Two units
# running the same code path against different routers is not a comparison —
# and the bakeoff is the only caller with no fallback, so it is the one whose
# failure is visible.
#
# systemd `EnvironmentFile=` and shell `set -a; . file` both accept this
# format, which is why it is KEY=value with no `Environment="..."` wrapper and
# no quoting: every value here is space-free, and a quoted value would be read
# literally-with-quotes by systemd.
#
# KREPIS_EXEC_CONTEXT is DECLARED, never inferred (model-router-policy R29):
# the resolver must not read a hostname or the metadata service to decide which
# registry entries can serve this caller.
KREPIS_EXEC_CONTEXT=ec2

# krepis resolves a group from the registry by walking up for a private-docs/
# directory, and these units run from /home/ec2-user/morning-signal, which has
# none.
LLM_MODEL_REGISTRY_PATH=/home/ec2-user/alpha-engine-config/private-docs/LLM_MODEL_REGISTRY.yaml

# Names THIS consumer's credential — the NAME, resolved from SSM at runtime,
# never the value. The edge identifies each consumer by its credential value,
# so a shared one would collapse every consumer into one identity
# (model-router-policy R22).
KREPIS_ROUTER_CREDENTIAL_SECRET=ROUTER_CONSUMER_MORNINGSIGNAL

# WHAT MAKES THE LINE ABOVE TRUE. krepis defaults the litellm_proxy route to
# http://127.0.0.1:8980 — the router PROCESS, not the authenticating nginx edge
# in front of it. A co-tenant consumer may address loopback
# (model-router-policy R27d), but the per-consumer credential is meaningful
# only AT the edge, which is what translates it into the router's own key; the
# process behind it knows the master key and nothing else, and has no database
# in which to look a virtual key up (`/health/readiness` reports
# `db: Not connected`). So the default URL and this credential are a
# (url, credential) pair that cannot authenticate, and the router answers every
# call `400 {"error":{"message":"No connected db."}}`.
#
# Measured: every scheduled run 2026-08-09 .. 2026-08-12 aborted its configured
# primary on that 400 and aired from a fallback. Fleet standard for this
# variable — the Think Tank spot dispatcher asserts both that it exports
# exactly this URL and that it never exports a 127.0.0.1 one.
KREPIS_LITELLM_PROXY_URL=https://router.nousergon.ai:8443
