# Dashboard box — box-level memory budget and restart semantics.
# (stamp bump 2026-08-05: force install-resource-limits re-run so the
#  box-state-backup catch-up after PR626's missed Result gate actually fires)
#
# WHY THIS FILE EXISTS, AND WHY IT LIVES IN THIS REPO
# ---------------------------------------------------
# This box runs 14 long-running services across eight products (alpha-engine,
# metron, telos, vires, the-cyphering, mnemon, nousergon-auth, plus dev
# infrastructure). Most of those services are OWNED by other repos.
#
# The memory budget is nonetheless a property of the BOX, not of any one app,
# because the invariant is about the SUM. No single app repo can enforce
# "everything fits in RAM" — only the repo that owns the box's infrastructure
# can, and that is this one (it already owns nginx.conf, box_health.sh,
# boot-pull.sh, all of which are similarly cross-product).
#
# THE TWO INVARIANTS
# ------------------
#   sum(memory_max_mb)      <= ceiling * max_overcommit_ratio    (bounded overcommit)
#   sum(live memory.current) <= RAM_MB * max_steady_state_fraction (steady-state safety)
#
# where ceiling = RAM_MB * (1 - reserve_fraction). See the overcommit note below
# for why the first bound is a ratio rather than 1.0.
#
# NOTE WHICH SIDE OF EACH BOUND IS DECLARED. The first is declared on both
# sides: caps are a policy choice and belong in a file. The second is declared
# only on the RIGHT — the fraction. Its left side is MEASURED from each unit's
# cgroup at check time.
#
# It used to be declared too, as an `observed_mb:` per service, and that was
# wrong in a way worth recording because it will be tempting to add back. A
# fixed number describing a continuously-moving quantity is a cache with no
# invalidation: it was hand-re-measured three times (litellm-proxy,
# metron-api/config-I5216, dashboard/config-I5237), and the day a check finally
# compared it to the box, three of fourteen units disagreed with their own
# entry — one by 2.8x. Every one of those findings was TRUE and none was
# actionable beyond editing the number back. Removed 2026-07-29; the sum is now
# read from `memory.current`, and the failure mode it generated cannot recur
# because the value it needed no longer exists.
#
# Per-service caps bound ONE runaway. They do nothing about several services
# growing toward their individually-legal ceilings at once — the kernel OOM
# killer then fires against whatever it picks, which need not be the service
# that caused the pressure. That is exactly what happened on 2026-07-25
# (metron-refresh OOM-killed while doing legitimate work) and again on
# 2026-07-27, when the sum stood at ~4650 MB against 1913 MB of RAM (2.4x)
# and the box cascaded: MemAvailable hit 44 MB, metron-dash stopped answering,
# and the SSM agent was starved badly enough that the box could not be managed
# remotely at all.
#
# Enforced by `infrastructure/check_memory_budget.py`, which is run by
# `box_health.sh` and can be run in CI.
#
# Governing policy: nous-ergon-ops/policies/shared-application-host-policy.md
#   T1-1 (aggregate limits <= RAM), T1-2 (uniform restart semantics),
#   T1-7 (right-sized instance).

ram_mb: 3839              # t3.medium, as reported by `free -m` total
reserve_fraction: 0.15    # kernel + page cache headroom => ceiling 3263 MB

# THE OVERCOMMIT RATIO IS DELIBERATE, MEASURED, AND BOUNDED
# ---------------------------------------------------------
# Caps must be sized for each service's STARTUP PEAK, not its steady state.
# Two services on this box proved that painfully on 2026-07-27:
#
#   litellm-proxy    at 150M/300M could never cold-start at all -- importing
#                    litellm's dependency tree exceeded the cap, so the unit
#                    reported active while never binding :8980.
#   llm-egress-proxy at 50M/100M throttled 11385 times with ~60% memory stall;
#                    a single `ssm get-parameter` hung for >113s. It shells out
#                    to the AWS CLI 5x (~150M peak each) during startup.
#
# Sizing every cap for its startup peak makes the SUM exceed the ceiling. That
# is acceptable here and is NOT the same defect as the 2.4x accidental
# overcommit that cascaded the box, because startup peaks DO NOT COINCIDE --
# services cold-start serially, not simultaneously (the one exception is boot,
# where systemd's own ordering staggers them).
#
# What actually governs steady-state safety is the live sum, measured from the
# cgroups. Both bounds are enforced by check_memory_budget.py — the caps bound
# in either mode, the steady-state bound in --installed mode only, because
# off-box there is nothing to measure and a declared substitute is what this
# file just finished removing.
#
# Policy section 5 T1-1 permits this explicitly: "Overcommit is permitted only
# as a documented, ratio-stated decision." This is that statement.
# NOTE ON THIS RATIO, so the next person does not misread it as physics: it is a
# DECLARED policy constant, not a measured property of the box. It was set to
# 1.20 when the sum stood at 1.18 — i.e. fitted to its own current value, which
# left no room for any legitimate cap increase. On 2026-07-28 that became the
# stated reason a correct cap could not be applied to dashboard.service, while
# the box actually had 1.4 GB of MemAvailable. A bound calibrated to the value it
# bounds does no independent safety work. The bound that governs real operation
# is max_steady_state_fraction below; this one only prevents the unbounded 2.4x
# accident. If it ever blocks a MEASURED cap again, that is a signal to re-derive
# it, not to shave the cap to fit.
# How close to its SOFT cap a unit may sit before the console row goes
# `attention` (alpha-engine-config-I5863). Declared here rather than derived,
# for the same reason the timer dead-man thresholds are: acceptable tightness is
# a decision, and deriving it from the cap would re-derive the wrong answer in
# exactly the case where the cap is the thing that is wrong.
#
# 0.90 is not arbitrary. Every re-pin this box has recorded happened from inside
# this band: dashboard.service sat at 96% of a 210M cap (I5237), metron-api at
# 99.7% of 385M (I5216), and on 2026-07-31 dashboard.service sat at 335/340 MiB
# -- 98.5% -- and took a 1020-event throttle burst. A threshold at the cap
# itself only ever fires after the reclaim has already started.
#
# This governs the CONSOLE ROW only. It is not a breach and does not page; the
# invariants that page are the two bounds above.
headroom_warn_fraction: 0.90

# Raised 1.20 -> 1.27 on 2026-08-03, under the paragraph directly above: a
# MEASURED cap (vires.service, see its note below) needed 460M and 1.20 left
# 115 MB of room against a 300 MB shortfall. Re-derived rather than shaved.
# Raised again 1.27 -> 1.30 on 2026-08-04 to enroll nousergon-console.service
# (112M unit MemoryMax; stdlib Python index on :5180). Same rule: re-derive
# when a measured/declared cap collides, don't shave the service. Steady-state
# bound remains the safety one — console's working set is small.
# The bound that governs real operation is max_steady_state_fraction, and
# un-pinning vires moves the live sum from 1516 MB to ~1730 MB — 45% of RAM
# against a 60% limit, so the safety bound is not the binding one here.
# Raised again 1.30 -> 1.34 on 2026-08-11, third application of the same rule:
# nousergon-console needed a MEASURED cap (112M -> 224M, see its note) and 1.30
# left 29 MB against a 112 MB shortfall. The ratio was fitted to its own value
# again — 1.29 of a 1.30 bound — which is precisely the condition the paragraph
# above says to re-derive from, not shave the service to fit. Steady-state
# remains the safety bound: the box measured 1601 MB available at the time.
max_overcommit_ratio: 1.34      # sum(memory_max) / ceiling. 1.33 with console at 224M.
max_steady_state_fraction: 0.60 # sum(live memory.current) / RAM. 0.37 on 2026-07-29.

# memory_high is the SOFT limit: the kernel throttles and reclaims against the
# service rather than killing it. memory_max is the HARD cap. Setting high at
# ~70% of max gives every service a reclaim window before it hits the wall —
# a service with only a hard cap goes from unconstrained straight to a kill.
#
# Caps are sized for each service's STARTUP PEAK, which for most units is ~2-3x
# its steady state but for the two proxies is far more (see their notes).
# Re-budget when the service set or instance type changes; a unit whose note
# says DO NOT LOWER was calibrated against a real failure, and lowering it
# reproduces that failure.
#
# `user:` IS A SUPPORTED FIELD AND IS DELIBERATELY UNSET ON EVERY SERVICE.
# ------------------------------------------------------------------------
# The renderer emits User=<value> (plus RemoveIPC=yes) for any service that
# declares one. On 2026-07-28 all thirteen were declared in one commit while
# the accounts they name did not exist on the box: every unit that restarted
# died with 217/USER and the console was down until the drop-ins were
# regenerated by hand. See alpha-engine-config-I4791.
#
# Do NOT re-add `user:` on its own. It is one half of a migration whose other
# half is create-service-users.sh actually having run on the box. Re-land both
# together, in this order:
#   1. route create-service-users.sh in deploy-on-merge.sh's ROUTED_INSTALLERS
#      (CI's TestProvisioningScriptRouting now requires this)
#   2. deploy, and confirm `getent passwd svc-<name>` resolves for all thirteen
#   3. only then re-add the `user:` fields here
# install-resource-limits.sh refuses to write anything if a declared user does
# not resolve, so getting this wrong now fails the deploy loudly instead of
# silently rendering fourteen unbootable units — but a failed deploy still
# blocks the queue, so the ordering above is the point, not a formality.

services:
  # ── alpha-engine ────────────────────────────────────────────────────────
  - unit: dashboard.service
    port: 8501
    memory_high: 420M
    memory_max: 450M
    note: >-
      2026-08-16: THE SOAK ANSWERED, AND THE ANSWER IS THAT THREE OF THE FOUR
      RAISES BELOW WERE SIZED ON THE WRONG QUANTITY. Measured on the box:
      current 411 MiB / 420M soft (98%, peak 421, reported CENSORED) of which
      anon was 183 MiB and reclaimable page cache 224 MiB. The working set is
      ~183 MiB — 44% of this cap — and the pin is a Streamlit process caching
      the files it reads until the cap reclaims them. That is the cap working,
      not demand being suppressed, and it is why this unit re-pinned within days
      of every raise: cache grows into whatever clearance it is given.
      Caps NOT changed on this reading, deliberately. 420M/450M sits ~2.3x the
      working set, the box has 49 MB of overcommit headroom left, and lowering a
      cap to squeeze a cache is a right-sizing decision with a real cost (more
      reclaim, slower page loads) that wants its own measurement — see
      config-I6287. What changed is the DETECTOR: check_memory_budget.py now
      judges a pin on anon + swap rather than on memory.current, so this unit
      stops asking for a fourth raise it does not need.

      2026-08-12: memory_high 340M -> 420M, memory_max UNCHANGED. memory.peak
      reached 341 MiB against a 340 MiB soft cap, so the service has been pinned
      since it last started and memory.current is a floor rather than a working
      set — the third time this unit has censored its own reading (I5237
      210->260, then 260->340, now this). The block below is what an uncensored
      measurement looked like the one time we had one.
      This raise is deliberately NOT derived from the pinned number, which is the
      move that produced the previous two re-pins: 420M clears the observed floor
      by ~79 MiB so the service runs un-pinned and I6287's 72h soak can measure
      what it actually needs. memory_max stays 450M, so the box's overcommit
      invariant is untouched (sum(memory_max) is unchanged at 4324 MB against a
      4373 MB bound — there were only 49 MB of headroom to spend, and this
      spends none of it) and the hard cap remains a real backstop. If the soak
      shows the working set above ~420 MiB, the answer is a right-sizing
      decision, not a fourth raise.

      Streamlit private console. Caps raised 260M/300M -> 340M/450M on the
      first UNCENSORED measurement of this service (2026-07-28: 248 MiB in use,
      against a then-recorded 202). I5237 raised memory_high 210M -> 260M and
      the service re-pinned within a day, because 202 was never the working set —
      it was a floor read under the old cap, exactly as that issue's own note
      predicted.

      Measured from a clean restart, cap well clear of the reading:
        t=20s   211 MiB      t=120s  231 MiB (peak 240)
        t=20min 235 MiB idle (peak 240, zero throttle events)
        in use  248 MiB, peak crossing 261
      It climbs fast for ~2 minutes and then plateaus. This is NOT a leak, and
      the growth is not the framework: nous-ergon-live.service runs the same
      Streamlit/plotly/pandas/boto3 stack from this same repo at 58 MiB, so the
      215 MiB cold start is application data, not imports.

      The old 260M soft cap sat INSIDE the normal operating band (235 idle ->
      261 in use), which is why throttling arrived in bursts of 26-102 per
      10-min tick rather than continuously. 340M clears the in-use peak by ~80
      MiB for large dataframe renders; 450M leaves a real reclaim window above
      it. The headroom was paid for by metron-api dropping to one worker below,
      not by loosening max_overcommit_ratio and not by resizing the instance —
      policy E3 does not fire (MemAvailable was 1396 MiB, trigger is 250 MiB).

      RESOLVED 2026-08-03 — this note previously read "STILL OUTSTANDING: the
      console has 181 `@st.cache_data` decorators and NOT ONE sets
      `max_entries` ... the plateau itself is not guaranteed". That has been
      false since alpha-engine-config#5270 landed: every cached loader now goes
      through `loaders/cache.py::cached`, which injects
      `max_entries=DEFAULT_MAX_ENTRIES` (64, sized 2026-07-31 against a
      measured thrash floor of ~30 and a measured byte ceiling). Verified
      2026-08-03: 173 `@cached` call sites, and every remaining literal
      `@st.cache_data` in the tree is inside a comment, a docstring, or a test
      double — zero live bare decorators. The plateau IS bounded now.

      Left uncorrected the note would keep arguing against a cap raise this
      service may legitimately need, on a premise that is no longer true.

      What IS still open for this service is growth over uptime, which is a
      different claim and is measured rather than asserted: on 2026-08-03 its
      `memory.peak` had reached 340 MiB = `memory.high` (a censored reading)
      after several days up, then read 180 current / 217 peak twenty minutes
      after a restart. So it climbs with uptime, not within a page render.
      Re-measure after a multi-day soak before concluding whether 340 is the
      right soft cap; do NOT re-cap off a fresh-restart reading, which is the
      opposite error to capping off a pinned one.

  - unit: nous-ergon-live.service
    port: 8502
    memory_high: 280M
    memory_max: 380M
    note: >-
      2026-08-13: 175M/250M -> 280M/380M. This unit had been pinned at its soft
      cap since at least 2026-08-11: `memory.peak` (175 MiB) == `memory.high`
      (175 MiB) with 34 high-events in the first 40 minutes after a restart, so
      every reading it contributed to the steady-state sum was a FLOOR and the
      sum understated the box by an unknown amount. It is the only unit on the
      box currently censored, and the last remaining source of the daily
      `notice: memory budget observation hygiene` alert.

      The 175M soft cap dates from an era when this service was recorded at
      56-72 MB (`observed_mb`, since removed). It now sits at 164 MiB of anon
      memory while throttled, which is a lower bound, not a working set.

      280M is deliberately NOT "just above the pinned number" — the check's own
      remedy text forbids that, because re-capping to the censored value
      re-pins on the next growth and produces the same finding again. It is
      1.6x the censored floor, in line with the 2.3-2.4x that #662 settled on
      for units whose peak WAS measurable. max at 380M keeps high at ~74% of
      max, the reclaim-window convention stated above.

      sum(memory_max) 4188 -> 4318 MB against the 4372 MB bound (1.32x of the
      3263 MB ceiling): paid for out of the 185 MB of headroom #662 reclaimed,
      without touching max_overcommit_ratio and without a resize. The steady
      state bound is not the binding one — 1593 MB measured, 41% of RAM against
      a 60% limit, with 1465 MB MemAvailable.

      THE NUMBER ABOVE IS PROVISIONAL AND MUST BE RE-DERIVED FROM A SOAK. A cap
      set while the reading is censored is an estimate by construction; the
      first uncensored `memory.peak` after several days up is the measurement
      this entry is owed. Same discipline as #661 for nousergon-console.
      Re-exam: alpha-engine-config-I7290.

  - unit: crucible-dash-api.service
    port: 8506
    memory_high: 300M
    memory_max: 350M
    note: >-
      2026-08-12: memory_high 245M -> 300M, memory_max UNCHANGED. Peak had
      reached 244 MiB against the 245M soft cap — one MiB from pinning, which
      would have made every subsequent reading a floor and put this unit on the
      same path nousergon-console and dashboard.service each took twice. Raised
      BEFORE it censored rather than after, which is the only time the fix is
      cheap: it costs nothing against the box's overcommit bound because
      memory_max does not move, and it preserves an uncensored reading instead
      of having to buy one back.

      Measured live 2026-07-28 at 185 MiB (peak 186 against a 245M cap, so
      uncensored) against a then-recorded 107. Surfaced by the FIRST run of
      --installed against the live box: the declared number understated this
      service by 78 MiB and nothing had ever compared it to reality, because
      --installed mode was invoked by nothing (see box_health.sh). That class of
      finding is gone with the declared field; the sum is measured now.
      At 185/245 this sits at 76% of its soft cap: not throttling today, but
      the tightest ratio on the box after dashboard. Re-measure before assuming
      headroom here.

  - unit: crucible-dash-web.service
    port: 3002
    memory_high: 154M
    memory_max: 220M

  # ── metron ──────────────────────────────────────────────────────────────
  - unit: metron-api.service
    port: 8000
    memory_high: 280M
    memory_max: 350M
    note: >-
      Was the largest consumer on the box at 384 MiB with FOUR gunicorn/uvicorn
      workers. Now one worker at 202-203 MiB (measured live 2026-07-28,
      peak 203, zero throttle events, /health 200). That is config-I5225 closed
      by removing the work rather than re-sizing around it.

      Standing ruling (Brian, 2026-07-28, reaffirming a repeated one): metron is
      a single-user personal tool and runs ONE worker. UvicornWorker is async, so
      one event loop already serves concurrent requests, and FastAPI runs sync
      `def` handlers in a threadpool inside it. Extra workers buy only CPU-bound
      parallelism — undeliverable on 2 vCPU — and worker-death resilience. What
      they cost is duplicate Python heaps: 182 MiB of the old 384 was pure
      duplication. Raising it again needs evidence of a real concurrency
      requirement, not a preference for headroom. Unit lives in metron-ops.

      Freeing that 182 MiB is what paid for dashboard.service's cap above. It
      also drained the box's swap from 475 MiB to ~0 and moved MemAvailable
      1396 -> 1632 MiB. Policy T1-7 calls swapping on EBS "strictly worse than
      paying for RAM"; this removed it without paying.

      Caps cut 480M/550M -> 280M/350M: 1.4x/1.7x the measured 203 MiB, which is
      also its startup peak (peak == current 45s after a cold start, with the
      cap 277 MiB clear of the reading — an uncensored measurement).

      Historical, kept because it is the reason the censored-reading check below
      exists: at 385M the cgroup logged 7347 MemoryHigh events during worker
      warm-up with memory.peak EQUAL to memory.high, so the then-recorded figure
      of 349 was never a working set — only the largest value the ceiling
      permitted.

      RE-MEASURED 2026-08-03, and the cap is CORRECT AS IT STANDS — do not
      raise it off the CENSORED finding this service used to produce. It read
      `peak 280 == high 280` after three days up, which the censored-reading
      check treated as "pinned, current is a floor". It was not. With the cap
      temporarily raised 280M -> 480M for thirteen minutes it did not move:

        current  214 MiB, flat at every one-minute sample
        peak     280 MiB, unchanged
        events   15 total across three days of uptime, zero new
        pressure some avg10=0.00 throughout

      Working set is ~214 MiB against a 280M soft cap (76%) — comfortable, and
      the 280 peak is a historical high-water mark, not suppressed demand.
      `memory.peak` never decays short of a restart, so a single graze of the
      soft cap made this service read censored on every tick for three days.
      The check was narrowed to require a CURRENT pin (see
      check_memory_budget.py::censored_observation); the cap was left alone.
      Raising it would have spent ~50 MiB of overcommit headroom the box does
      not have, on a reporting artifact.

  - unit: metron-dash-web.service
    port: 3003
    memory_high: 154M
    memory_max: 220M

  # ── other products ──────────────────────────────────────────────────────
  - unit: telos-web.service
    port: 3001
    memory_high: 105M
    memory_max: 150M

  - unit: vires.service
    port: 8530
    memory_high: 380M
    memory_max: 460M
    note: >-
      Caps raised 112M/160M -> 380M/460M on 2026-08-03, after the service
      wedged in normal use. DO NOT LOWER: 112M was roughly a THIRD of this
      service's real working set, and every reading taken under it was a floor.

      Root cause, measured on the box rather than inferred. vires does hybrid
      exercise search: SQLite FTS5 plus a vector leg, and the vector leg embeds
      the QUERY at request time with FastEmbed / bge-small-en-v1.5 (ONNX). The
      model is lazy-loaded on the first search, so the service starts at ~103
      MiB — comfortably inside 112M — and stays there until someone types in
      the exercise search box or opens the in-workout "replace" sheet. Then:

        bare interpreter                     8 MiB
        after `import api.services.embedder` 44 MiB
        after the FIRST embed_query()       257 MiB   (VmRSS, not a peak:
        after 20 more embeds                257 MiB    unchanged after gc)

      +213 MiB marginal, against a soft cap that left 9. Full-service working
      set with the model resident is therefore ~316 MiB. `threads=1` was
      measured too and returns only 18 MiB, so this is ONNX Runtime's resident
      model, not thread arenas — it cannot be tuned away, only budgeted for or
      moved out of process.

      What that did, 2026-08-03 15:17-15:36 UTC: opening the replace sheet
      loaded the model, the cgroup pinned at MemoryHigh and went to
      `some avg10=55.27 / full avg300=49.93` — stalled on reclaim more than
      half of all wall-clock — and stayed there. 350,458 MemoryHigh events,
      zero OOM kills. That distinction is the whole failure mode: the process
      never died, so `Restart=always` never fired, the port stayed bound, and
      the box reported healthy while no HTTP request completed for ~18 minutes.
      The user found it by using the app.

      460M is 1.46x the measured 316 MiB, 380M soft leaves the service ~64 MiB
      clear of its working set. Sized like metron-api's (1.4x/1.7x), not fitted
      to the pinned reading — per the standing note above, re-cap clear of the
      service, never just above where it was pinned.

      Paid for by re-deriving max_overcommit_ratio (1.20 -> 1.27), which the
      ratio's own note directs when a measured cap collides with it. The
      steady-state bound, the one that governs real safety, moves 39% -> ~45%
      of RAM against its 60% limit.

      RULED 2026-08-03 (Brian), superseding this note's original close: the
      213 MiB ONNX model STAYS in vires' request path and this cap is the whole
      fix. Vires is a personal product with monetization deprioritized —
      "runnable" is the requirement, not "cheap to run" — so no further infra
      investment is warranted on it. The three destinations were priced and
      all lose: litellm-proxy on this box relocates the 213 MiB into another
      cgroup on the same 3839 MB (a shuffle, not a move); a hosted embeddings
      API frees it but buys a network hop in the search debounce, a DLP egress
      path, an external dependency and a degradation ladder; deleting the
      query-time vector leg frees it but is a product decision about search
      quality, not an infra one.

      Load-bearing for the next person: the 213 MiB is a FIXED cost, not a
      growing one — one model, loaded once, measured flat across 20 embeds and
      a gc. There is no trajectory here that forces action later.

      Named fallback, if and only if this box later needs the RAM: delete the
      query-time vector leg (`vires/api/services/search.py`, the `embed_query`
      call in the RRF fusion) and let FTS5/BM25 carry search. A deletion, not
      a build — which is why it is the lever to reach for rather than a
      migration.

      What this cap DID consume is the overcommit headroom: the sum sits at
      1.26x against a 1.27x bound. The next service needing a measured cap
      raise collides immediately, and THAT collision — not vires — is what a
      resize decision gets made against (alpha-engine-config-I6263).

  - unit: signal.service
    port: 8505
    memory_high: 175M
    memory_max: 250M

  - unit: mnemon.service
    port: 8503
    memory_high: 175M
    memory_max: 250M
    note: >
      Was capped at 150M with MemoryHigh=infinity — 109M observed against a
      150M hard cap and no soft limit at all, i.e. closest to its ceiling of
      any service on the box while having no reclaim window. Raised.

  - unit: nousergon-auth.service
    port: 4100
    memory_high: 105M
    memory_max: 150M
    note: >
      Shared identity service. Found DISABLED (not enabled at boot) on
      2026-07-27 — it was running only because someone had started it by hand,
      and it did not survive the first reboot. Enabled since.

  - unit: nousergon-console.service
    port: 5180
    memory_high: 200M
    memory_max: 224M
    note: >-
      2026-08-12: memory_high 160M -> 200M, memory_max UNCHANGED, sized from the
      first UNCENSORED reading this unit has ever had. Caps were lifted to
      600M/800M at runtime (`systemctl set-property --runtime`, reverted the
      same session) and the service was sampled every 45s for ten minutes:

        memory.current  oscillated 120-152 MiB
        memory.peak     163 MiB, and STOPPED THERE
        MemoryHigh evts  266 before, 266 after -- not one new throttle

      Corroborated independently: one `build_index` pass run in isolation on
      the box peaked at 159 MiB RSS (93.5s wall, 315 entities). Two methods,
      four MiB apart.

      SO IT IS NOT A LEAK, AND IT NEVER WAS. The working set is ~163 MiB and
      the 2026-08-11 raise to 160M landed roughly three MiB under it -- which
      is why "~2x the censored floor" re-pinned inside a day and read like
      runaway growth. 200M clears the measured plateau by 37 MiB.

      memory_max stays 224M deliberately: sum(memory_max) is what the box's
      overcommit bound limits, and it had 49 MB of room, so this raise costs
      NOTHING. 224M leaves the hard cap 61 MiB above the plateau.

      The 163 MiB is the BUILDER, not the served index -- a full pass takes
      93.5s against a 60s cadence, so the process is rebuilding 61% of the
      time. Anyone sizing this cap is sizing that (alpha-engine-config-I7124).

      Fleet monitoring console (nousergon/nousergon-console). Stdlib Python
      server on loopback :5180; nginx is the sole ingress. Enabled on the box
      without a budget row → box_health named it unmonitored (2026-08-04).
      Enrolling here also regenerates the watchdog manifest port list and
      applies the uniform Restart=/OOMPolicy=stop drop-in (the unit file still
      carries the invalid OOMPolicy=restart literal — drop-in wins
      alphabetically as 99-).

      Raised 80M/112M -> 160M/224M on 2026-08-11 (alpha-engine-config-I6853),
      after box_health reported 51 MemoryHigh events in one tick. MEASURED on
      the box the same day, ~7h after a restart:
        memory.current  82.4 MB      anon        78.3 MB
        memory.peak     84.1 MB      throttled   562x, oom_kill 0
        pressure        some avg300=0.05 (negligible stall)
      The working set sits ABOVE its own 80 MiB soft cap and the box had
      1601 MB available, so nothing about this was a resource shortage.

      WHY THE OLD NUMBER WAS NEVER RIGHT: it was not measured. The note this
      replaces said so out loud — "Caps match the unit file's MemoryMax=112M"
      — and that 112M was itself an unmeasured literal written into the app's
      own unit file before the console indexed anything. A cap derived from a
      cap is not a budget. The denominator work of 2026-08-10/11 (population
      166/166) grew the index this process holds, and a limit that was never
      sized for a working set could not follow it.

      WHY 160/224 AND NOT A TIGHTER FIT: 84.1 MB is a CENSORED reading —
      memory.peak cannot exceed memory.high, so it reports the cap, not the
      demand. Re-capping off it repeats I5237 exactly, where dashboard.service
      was raised 210M -> 260M off a floor-read 202 and re-pinned within a day.
      160M is ~2x the censored floor: enough that the NEXT reading is
      uncensored and the real plateau becomes visible for the first time.
      224M keeps soft at ~70% of hard, the box convention. Re-derive both from
      an uncensored multi-day soak — see alpha-engine-config-I6853, which
      closes on that measurement, not on this raise.

  # ── dev infrastructure ──────────────────────────────────────────────────
  - unit: litellm-proxy.service
    port: 8980
    memory_high: 350M
    memory_max: 500M
    note: >
      DO NOT LOWER without re-testing a cold start. Calibrated 2026-07-27
      (alpha-engine-config-I4441/I4451): at 150M/300M this unit could never
      cold-start — importing litellm's dependency tree exceeded the cap, the
      cgroup throttled continuously, and the service reported active while
      never binding :8980. Steady state 308M; the gap between that and 500M is
      startup headroom, not slack. Separately has known memory growth (I4441);
      Restart=always now recycles it on an OOM kill instead of letting it die.

  - unit: llm-egress-proxy.service
    port: 8990
    memory_high: 210M
    memory_max: 300M
    note: >
      2026-08-12: 250M/400M -> 210M/300M. The DO-NOT-LOWER below is preserved
      because its REASONING still holds and only its NUMBER was wrong, and the
      distinction matters if anyone is tempted to go further.

      What it got right: steady state is unrepresentative, startup is what must
      be budgeted, and at 50M/100M this service genuinely could not boot. What
      it never had was a measurement of the startup it was reasoning about. The
      "~150M peak each" for five AWS CLI subprocesses was an estimate.

      Measured: memory.peak 126 MiB over SIXTEEN DAYS of uptime — a window that
      contains the 2026-07-27 startup those subprocesses run in, so it is a
      startup-inclusive high-water mark, not a steady-state read. 400M was 3.2x
      it. 300M is 2.4x, and still three times the 100M that broke it.

      Do NOT take this as licence to trim toward the steady state; the estimate
      was wrong in size, not in kind.
      Calibrated 2026-07-27 (alpha-engine-config-I4451): at 50M/100M the cgroup
      throttled 11385 times with ~60% memory stall and a single
      `ssm get-parameter` hung for >113s, so the service never finished booting.
      Startup shells out to the AWS CLI 5x (~150M peak each) to resolve provider
      keys, then runs gitleaks subprocesses per scan. The 6x gap between
      observed and cap is entirely startup and subprocess spikes.

  # ── ingress ─────────────────────────────────────────────────────────────
  - unit: nginx.service
    port: 443
    memory_high: 45M
    memory_max: 64M
    note: >-
      Sole ingress for all ten vhosts — Restart=always is load-bearing; already
      runs as its own user, no User= migration needed.

      2026-08-12: 70M/100M -> 45M/64M, the FIRST cap on this box ever lowered.
      Measured peak 28 MiB over 16 days of uptime, so 100M was 3.5x a demand
      that has had sixteen days to spike and did not. 64M is 2.3x that peak.
      Reported by check_memory_budget.py's over-provision check on its first
      tick after install (config-I7102) — the reclaimed 36 MB is headroom the
      overcommit bound can spend on a unit that needs it.

# Restart semantics applied uniformly to every unit above (policy T1-2).
#
# `Restart=always` IS the restart-on-OOM mechanism. There is no
# `OOMPolicy=restart` -- systemd.service(5) takes only `continue`, `stop`, or
# `kill`, and an invalid value is SILENTLY IGNORED (systemd falls back to the
# default and logs nothing at the unit level). Verified live on systemd 252:
# a drop-in carrying `OOMPolicy=restart` left `systemctl show -p OOMPolicy`
# reporting `stop`, while `Restart=` and `MemoryMax=` from the same block
# applied normally. Anything that "looks applied" here must be read back from
# `systemctl show`, never assumed from the file on disk.
#
# The working combination is:
#   OOMPolicy=stop   -> on an OOM kill systemd terminates the unit cleanly,
#                       stopping its remaining processes rather than letting a
#                       multi-process unit limp on with a dead worker (which is
#                       what `continue` would do).
#   Restart=always   -> systemd then restarts it 5s later, because `always`
#                       restarts on ANY stop, including that clean termination.
#
# CORRECTION to the original I4491 analysis: `OOMPolicy=stop` was NOT the
# mechanism that kept metron-refresh dead for two days. `stop` is systemd's
# default and is correct here. metron-refresh is `Type=oneshot`, `static`, and
# timer-triggered -- a failed oneshot batch job legitimately does not restart.
# Its real defects were that nothing ALERTED on the failure and that its timer
# went inactive; both are tracked in I4487, not fixed by restart semantics.
#
# StartLimitBurst bounds the loop: a genuinely broken service still lands in
# `failed` after 5 restarts in 300s, where box_health.sh sees it. Restart=always
# without a limit is its own failure mode.
restart_policy:
  Restart: always
  RestartSec: 5s
  OOMPolicy: stop
  StartLimitIntervalSec: 300      # [Unit] section
  StartLimitBurst: 5              # [Unit] section

# Units that are legitimately NOT under box_health.sh coverage. The watchdog's
# coverage self-check reports any enabled, non-oneshot unit that is neither in
# `services:` above nor excluded here — so a new app service surfaces as an
# alert instead of going quietly unmonitored, while OS plumbing stays quiet.
#
# Exclusions are BY NAME WITH A REASON. A bare count cannot say what is
# missing, and a count-based check false-alarmed on exactly these units when
# first deployed 2026-07-27.
# ── Durable state inventory (T1-4, alpha-engine-config-I5250 gap 1) ───────
#
# WHY THIS EXISTS
# ---------------
# Policy T1-4: "Every SQLite file, vault, and cert on this box is either
# replicated to S3 on a schedule or documented as accepted-loss with a stated
# RPO. UNLISTED STATE IS A DEFECT."
#
# Audited 2026-07-28. Before that audit NO application state on this box was
# replicated anywhere, and that was not a decision — it was an absence. The
# nightly EBS snapshot (T0-1) bounded loss to <=24h by accident rather than by
# declaration, and an EBS snapshot of a live SQLite file is CRASH-consistent,
# not APPLICATION-consistent: a snapshot taken mid-write restores a database
# that needs WAL recovery, which is not the same as a database you can open.
#
# A near-miss worth recording: `mnemon-sync.timer` looks like a backup and is
# the opposite of one. It runs `aws s3 cp s3://mnemon-memory/... -> local`,
# a one-way PULL. S3 is mnemon's source of truth and the box holds a replica,
# so mnemon loses nothing on box loss — but reading that timer as "mnemon is
# backed up" would have been exactly wrong.
#
# DISPOSITIONS
#   replicate     — copied to S3 on the box-state-backup timer. Use for state
#                   that is irreplaceable or that other products depend on.
#   accepted-loss — deliberately NOT replicated, with an rpo: stating the
#                   worst-case loss. Policy §7 permits this for personal tools
#                   PROVIDED IT IS STATED. That proviso is the whole point:
#                   accepted-loss and never-considered look identical on disk.
#   external      — the box copy is a cache/replica; the real source is
#                   elsewhere. Loss costs a re-fetch.
#
# Backups land under s3://alpha-engine-research/dashboard/box-state/. The
# instance role can PutObject there but NOT DeleteObject — verified 2026-07-28.
# That asymmetry is deliberate and worth keeping: a compromised or malfunctioning
# box cannot destroy its own backup history.
state:
  - path: /home/ec2-user/nousergon-auth/auth.sqlite
    owner: nousergon-auth.service
    disposition: replicate
    note: >-
      Shared identity for every product on the box. Losing it invalidates
      sessions and user records across all of them simultaneously, which is
      the largest blast radius of any single file here — hence replicate
      rather than accepted-loss, despite being small.
  - path: /home/ec2-user/metron/personal.sqlite
    owner: metron-api.service
    disposition: external
    source: neon:soft-scene-07961098 (SSM /metron/database_url)
    note: >-
      SQLite→Neon data migration completed 2026-07-31 (system_state/dashboard.md);
      metron-api / metron-dash-web / metron-refresh* read Neon via session
      drop-ins. Local personal.sqlite is vestigial if present — Neon is
      authoritative. Was disposition:replicate until cutover; leaving it
      replicate made box-state-backup.service exit non-zero every night
      ("declared replicate but does not exist"), which is the 2026-08-04
      CRITICAL box-health page. metron-ops-I237 stays open only for durable
      deploy hydration (metron-ops-I261), not for the data path.
  - path: /home/ec2-user/vires/vires.db
    owner: vires.service
    disposition: replicate
    note: actively written (2026-07-28); personal tool but its content is user-authored, not derived
  - path: /home/ec2-user/.mnemon/default.sqlite
    owner: mnemon.service
    disposition: external
    source: s3://mnemon-memory/mnemon/vaults/default.sqlite
    note: mnemon-sync.timer PULLS this from S3 every 15 min; S3 is authoritative
  - path: /home/ec2-user/morning-signal/episodes/flow-doctor.db
    owner: morning-signal.timer
    disposition: accepted-loss
    rpo: 24h
    note: flow-doctor run telemetry; regenerates on the next run, no product depends on the history
  - path: /home/ec2-user/metron/web/auth.sqlite
    owner: none
    disposition: accepted-loss
    rpo: total
    note: >-
      Last written 2026-07-10 and superseded by nousergon-auth. Declared rather
      than deleted so its absence from backups is a decision on the record;
      removal is tracked separately.
  - path: /home/ec2-user/morning-signal/flow-doctor.db
    owner: none
    disposition: accepted-loss
    rpo: total
    note: >-
      Zero bytes — a vestigial file at the repo root, distinct from the live
      episodes/flow-doctor.db. Found by the coverage check below, NOT by the
      manual audit that produced this inventory, which is the argument for
      having the check at all.
  - path: /home/ec2-user/metron/dev.sqlite
    owner: none
    disposition: accepted-loss
    rpo: total
    note: zero bytes, last touched 2026-06-25; a dev scratch DB, superseded by personal.sqlite
  - path: /home/ec2-user/flow-doctor/flow_doctor.db
    owner: none
    disposition: external
    source: git:nousergon/flow-doctor (committed in the repo, refreshed by the daily 12:01 UTC pull)
    note: >-
      Measured 2026-08-13: 106,496 bytes, TRACKED IN GIT (last commit
      2026-08-12 11:25 PT), working tree clean, no process holding it open —
      so the box copy is a checkout artifact, not box-authored state, and box
      loss costs a re-clone. Underscore, not hyphen: distinct from
      morning-signal/flow-doctor.db and morning-signal/episodes/flow-doctor.db,
      both of which are separate rows above and neither of which is this file.
      Note the alert that surfaced it named `/home/ec2-user/flow-doctor/flow-doctor.db`,
      a path that does not exist on the box — the detector's own `find` output
      is correct, so the mangling is downstream in notification rendering
      (filed separately).
  - path: /home/ec2-user/.ssh/
    owner: none
    disposition: accepted-loss
    rpo: total
    note: >-
      Contains alpha-engine-key.pem and the cyphering_ops_deploy key. NOT
      replicated on purpose — copying private keys into an object store to
      protect against a box loss trades a bounded availability problem for an
      unbounded confidentiality one. Both are re-issuable from their sources.
  - path: /home/ec2-user/*/.env
    owner: various
    disposition: external
    source: SSM SecureString /alpha-engine/dashboard/secrets/*
    note: six .env files; canonical copies live in SSM and are re-materialised on rebuild

# ── Timer dead-man thresholds (alpha-engine-config-I5209) ─────────────────
#
# WHY A DECLARED THRESHOLD AND NOT AN INFERRED ONE
# ------------------------------------------------
# box_health.sh's scheduler-state check (classify_timer) answers "is this timer
# scheduled to fire?" It CANNOT answer "did it actually do its job?" — a timer
# whose service exits 1 on every single run is `active`, `waiting`, with a
# perfectly valid next elapse. That is the more common silent failure, and it
# needs an execution-outcome check with a per-job staleness budget.
#
# The budget is declared here rather than derived from the unit's own
# `OnCalendar=`/`OnUnitActiveSec=` on purpose. Acceptable staleness is a
# product decision, not a restatement of the schedule: a weekly bakeoff
# tolerates eight days of silence, a nightly NAV snapshot does not tolerate
# twenty-six hours. More importantly, inferring the threshold FROM the schedule
# silently re-derives the wrong threshold in exactly the case where the
# schedule is the thing that broke.
#
# HOW TO SET ONE
# --------------
# Start at 2x the nominal interval, then widen for real-world gaps the interval
# does not express: randomized delay, weekday-only schedules crossing a
# weekend, multi-fire retry ladders. Every value below is the observed cadence
# from the live box on 2026-07-28, widened for those, and each carries the
# reasoning as a `note:` — a bare number here is unreviewable.
#
# COVERAGE IS TOTAL, DELIBERATELY. Every enabled timer on the box gets a row,
# including OS plumbing. box_health.sh NAMES any enabled timer with no row, so
# a timer added without one surfaces as an alert rather than going quietly
# unmonitored — the same rule `services:` lives under. OS timers are not exempt
# because their failures are not cosmetic on this box: logrotate and fstrim
# guard a 32 GB root volume, dnf-automatic is the T1-5 patching cadence.
timers:
  # ── alpha-engine ────────────────────────────────────────────────────────
  - unit: box-health.timer
    max_staleness: 30m
    note: every 10min; 3x covers one missed tick plus a slow confirm window
  - unit: emit-oom-metric.timer
    max_staleness: 20m
    note: every 5min; the OOM counter feeding the T0-3 saturation alarms
  - unit: boot-pull.timer
    max_staleness: 26h
    note: daily 12:00 UTC + up to 5min randomized delay
  - unit: router-spend-export.timer
    max_staleness: 26h
    note: >-
      daily 06:20 UTC + up to 2min randomized delay, Persistent=true; same 26h
      shape as boot-pull. Arrived with nous-ergon-ops-PR630 (config-I7063) and
      box_health.sh named it as uncovered on its next run — which is the
      coverage check doing its job, so the row is added rather than the notice
      silenced. The export is model-router-policy R31 bound 2: silence here
      means per-call cost attribution stops accruing, and that is invisible
      until someone asks what a lane cost.
  - unit: box-hygiene.timer
    max_staleness: 8d
    note: weekly Sun 09:20 UTC; one full missed week is the signal
  - unit: reboot-if-needed.timer
    max_staleness: 8d
    note: weekly Sun 07:00 UTC. Persistent=false, so a box down at 07:00 skips
          the week entirely — 8d catches the second consecutive skip
  - unit: substrate-health-daily.timer
    max_staleness: 4d
    note: Mon-Fri 22:30 UTC; Fri->Mon is a 3-day gap by design
  - unit: box-state-backup.timer
    max_staleness: 26h
    note: nightly 03:40 UTC + up to 5min randomized delay; a skipped run leaves a real gap in the backup history
  - unit: systemd-unit-drift-check.timer
    max_staleness: 26h
    note: daily 06:17 UTC + up to 5min randomized delay
  - unit: scan-unlisted-state.timer
    max_staleness: 26h
    note: daily 04:20 UTC + up to 5min randomized delay; the T1-4 unlisted-state
          scan (config#6719) — a silent stop reopens the blind spot it closes

  # ── nous-ergon-ops live-infrastructure ──────────────────────────────────
  - unit: certbot-renew.timer
    max_staleness: 26h
    note: twice daily 03:00/15:00 UTC + up to 60min randomized delay. 26h (two
          consecutive misses) is deliberate — one missed attempt costs nothing
          against a 30-day renewal window, but a silently dead timer costs the
          router edge its Let's Encrypt cert at the deadline
  - unit: ops-config-drift.timer
    max_staleness: 26h
    note: daily 06:48 UTC; pulls the box's sparse nous-ergon-ops checkout and
          runs check-box-config-drift.sh — a dead timer here means codified
          config silently stops reaching the box
  - unit: router-degraded-mode-drill.timer
    max_staleness: 8d
    note: >-
      Weekly Tue 10:30 UTC. Persistent=false and RandomizedDelaySec=0, so a box
      down at 10:30 skips the week outright rather than making the run up — 8d
      is one full missed week plus 24h, the same shape as reboot-if-needed.
      This dead-man is not redundant with the drill's own
      router-degraded-mode-drill-stale alarm: that one watches the S3
      completion pointer and answers "did a drill COMPLETE", while this one
      answers "is the timer still firing at all", and the 2026-08-12 install
      produced exactly the state where those two differ — a timer that fired
      and a drill that deliberately did not run.

  # ── metron ──────────────────────────────────────────────────────────────
  - unit: metron-refresh.timer
    max_staleness: 26h
    note: three same-evening fires (20:45/21:30/22:30 UTC) are ONE nightly job
          with a retry ladder, so the real cadence is daily, not 3x daily.
          This is the job whose 2026-07-25 OOM kill went unnoticed for two days
  - unit: metron-refresh-flex.timer
    max_staleness: 4d
    note: Mon-Fri 13:15 UTC; Fri->Mon is a 3-day gap by design

  - unit: metron-intraday.timer
    max_staleness: 20m
    note: >-
      Every 5 min unconditionally; the collector gates each tick on the NYSE
      session in-process, so an off-session tick is a fast successful no-op and
      the cadence never pauses. 4x covers one missed tick plus a slow S3 round
      trip. Installed 2026-07-29 with no row here, which is how it reached the
      box failing 48/48 runs on an S3 AccessDenied while box_health.sh reported
      only that the row was missing.
  - unit: metron-deploy-drift.timer
    max_staleness: 3h
    note: hourly at :07; 3x covers one missed tick plus a slow run, same ratio
          as box-health's 30m
  - unit: metron-reconcile.timer
    max_staleness: 26h
    note: daily 23:15 UTC (config#6657 filed it as weekly — the installed
          OnCalendar says daily; measured 2026-08-09)

  # ── morning-signal / the-cyphering ──────────────────────────────────────
  - unit: morning-signal.timer
    max_staleness: 26h
    note: daily 04:00 America/Los_Angeles; DST shifts the UTC hour, not the gap
  - unit: morning-signal-watchdog.timer
    max_staleness: 26h
    note: daily 06:15 America/Los_Angeles
  - unit: morning-signal-pull.timer
    max_staleness: 26h
    note: daily 04:55 America/Los_Angeles; codified by crucible-dashboard-PR635
          on 2026-08-09 WITHOUT a row here — the box_health notice caught it the
          same day, which is config#6657 deliverable 3 working as intended
  - unit: morning-signal-bakeoff.timer
    max_staleness: 8d
    note: weekly Wed 05:00 America/Los_Angeles
  - unit: daily-news.timer
    max_staleness: 26h
    note: daily 04:00 America/Los_Angeles
  - unit: signal-pull.timer
    max_staleness: 26h
    note: daily 15:10 UTC

  # ── mnemon ──────────────────────────────────────────────────────────────
  - unit: mnemon-sync.timer
    max_staleness: 45m
    note: every 15min; 3x absorbs one slow sync plus one missed tick

  # ── OS plumbing (covered, not exempt — see the note above) ──────────────
  - unit: logrotate.timer
    max_staleness: 26h
    note: daily; guards the 32 GB root volume against journal/log growth
  - unit: dnf-automatic.timer
    max_staleness: 27h
    note: daily 06:00 + up to 60min randomized delay; the T1-5 patch cadence
  - unit: fstrim.timer
    max_staleness: 9d
    note: weekly + up to 100min randomized delay
  - unit: sysstat-collect.timer
    max_staleness: 30m
    note: every 10min at :00/10
  - unit: sysstat-summary.timer
    max_staleness: 26h
    note: daily 00:07
  - unit: systemd-tmpfiles-clean.timer
    max_staleness: 30h
    note: OnUnitActiveSec=1d, so it drifts later each day rather than pinning
          to a wall-clock hour
  - unit: update-motd.timer
    max_staleness: 30h
    note: OnUnitActiveSec=720min PLUS RandomizedDelaySec=720min, so the real
          interval is 12-24h — 2x the nominal 12h would false-alarm

# ── Timer-driven jobs (policy §4.3, added 2026-07-29) ─────────────────────
#
# WHY THESE ARE DECLARED HERE AND NOT IN `services:`
# --------------------------------------------------
# `services:` is a CONCURRENCY bound: every unit in it is running all the time,
# so their caps can sum above RAM simultaneously and T1-1 exists to stop that.
# A timer-driven oneshot is not in that set — metron-intraday runs for ~3
# seconds every 5 minutes.
#
# But it is not exempt from having a footprint either. Policy §4.3 requires a
# measured, declared ceiling for anything installed here, and §4's stricter
# batch rule says a timer job whose PEAK exceeds the box's steady-state headroom
# "does not belong here at all — it belongs on a spot instance or Lambda".
#
# Until now these lived nowhere. morning-signal.service's caps sat in a drop-in
# that the budget's own orphan check SUPPRESSED by name (DROPIN_ALLOW in
# check_memory_budget.py) — "not our problem" rather than "declared". That is the
# same shape as an undeclared alert source: invisible is not the same as fine.
# Declaring them removes a suppression instead of adding one.
#
# THE BOUND
#   sum(timer_jobs memory_max) <= RAM - sum(live service steady state)
#
# i.e. every timer job must fit in the headroom the long-running services leave,
# in the worst case where they all fire at once. That is conservative for jobs on
# disjoint schedules and deliberately so: the cheap direction to be wrong in is
# the one where a batch peak cannot evict a user-facing service.
#
# measured_peak_mb is the observed peak RSS the caps derive from. Unlike the
# `observed_mb` this file used to carry per service, it is NOT an input to any
# bound — it is provenance for the cap beside it, so a future edit knows whether
# it is re-deriving or guessing. Nothing recomputes from it, so it cannot rot
# into a wrong answer.
timer_jobs:
  - unit: metron-intraday.service
    memory_high: 260M
    memory_max: 350M
    measured_peak_mb: 184
    note: >-
      Every 5 min, NYSE-session-gated in-process. Measured 2026-07-29 across
      three real runs: 184 MB peak, 3.2-3.7s wall, 7 quotes + 4 indices + 2
      fund-proxies. Caps live in the unit file itself (nousergon-data,
      infrastructure/systemd/metron-intraday.service), not a drop-in.
      Runs on a DEDICATED .venv-intraday (Python 3.12) — the shared .venv is 3.9
      and has no pandas/yfinance, which is how this job spent its first hours
      writing empty artifacts over good ones while reporting success.

  - unit: morning-signal.service
    memory_high: 370M
    memory_max: 530M
    measured_peak_mb: 224
    note: >-
      Caps in infrastructure/systemd/morning-signal.service.d/10-memory.conf.

      2026-08-14 (alpha-engine-config-I5546): 600M/900M -> 370M/530M, and
      measured_peak_mb is no longer null. The old numbers were the largest
      single claim on this box's timer-job headroom with nothing behind them;
      30-record-peak.conf was installed to end that by logging every run's
      cgroup peak from ExecStopPost, and six runs are now on record in
      /home/ec2-user/.morning-signal-peak.log, all result=success:
      72, 158, 206, 224, 71, 204 MiB (2026-08-09 .. 08-13).

      530M is 2.4x the 224 MiB MAXIMUM — the band #662 settled on and the same
      multiple check_memory_budget.py's proposal loop derives, so this will not
      be re-argued from a different rule next month. Sized on the maximum and
      not the mean: the two ~72 MiB entries are short episodes, and a cap fitted
      to the average would OOM the full-episode-plus-TTS path that produces the
      224. Timer-job caps total 1250 -> 880 MB against ~2246 MB of headroom.

# ── Observed, deliberately uncapped (alpha-engine-config-I5276) ───────────
#
# Everything in `services:` above carries a declared cap. These two do not, and
# the whole point of this block is that the absence is now a DECISION with a
# measurement behind it rather than an omission. I5276 refused "not mentioned
# anywhere" as an end state, and it was right to: the two AWS agents were left
# out of the budget because they were on `manifest_exclude` for WATCHDOG
# COVERAGE reasons ("has its own supervision"), and a liveness-monitoring
# exclusion silently became a memory-budgeting one.
#
# WHAT THE JULY READING ACTUALLY MEASURED. I5276 recorded amazon-ssm-agent at
# 435 MiB — "largest single consumer on the box" — and flagged it as a hole in
# T1-1. Measured again 2026-08-14 over 18 days of agent uptime:
#
#   memory.current   518 MB      memory.peak   1689 MB
#   anon (memory.stat)  34 MB    file (page cache)  421 MB
#   its own processes: amazon-ssm-agent 11 MB RSS + ssm-agent-worker 18 MB
#
# The agent's own demand is ~34 MB. The rest is (a) reclaimable page cache the
# kernel charges to this cgroup and gives back under pressure, and (b) every
# command SSM has ever delivered — which on this box includes
# deploy-on-merge.sh, since deploy.yml runs the entire build through
# `ssm send-command`. The 1689 MB peak is a deploy, not an agent.
#
# So a cap here would not bound the agent; it would bound the deploy, and an
# OOM inside it would kill the box's ONLY remote-management path (SSH is
# closed). I5276 anticipated exactly this in its deliverable 4. The correct
# place for that bound is around the deploy itself, not around the agent that
# happens to host it — filed separately rather than done here, because it
# changes the deploy path and this file is not where that lands.
#
# Both are therefore uncapped ON PURPOSE, and OBSERVED: check_memory_budget.py
# folds their peaks into the rolling marks every 10 minutes (I7294) and reports
# them in `--propose-caps` output, with anon shown next to current so the next
# reader is not arguing from the page cache. Never proposed against — they have
# no declared cap for a proposal to move.
observe_only:
  - unit: amazon-ssm-agent.service
    reason: >-
      Uncapped by decision, 2026-08-14. Hosts every SSM-delivered command
      including the deploy build, so its cgroup readings are not its own
      demand (34 MB anon against 518 MB current). Capping it caps the deploy
      and risks killing the only remote-management path to this box.
  - unit: amazon-cloudwatch-agent.service
    reason: >-
      Uncapped by decision, 2026-08-14. Measured 41 MB current / 65 MB peak
      over 15 days — the smallest footprint on the box. A cap here would be
      ceremony: there is no plausible growth path it would catch that the
      box-level MemAvailable alarm would not.

manifest_exclude:
  - unit: "alert-on-failure@.service"
    reason: systemd template unit, never instantiated directly
  - unit: amazon-cloudwatch-agent.service
    reason: AWS agent, has its own supervision and its own alarms
  - unit: dbus.service
    reason: OS plumbing
  - unit: dbus-org.freedesktop.home1.service
    reason: OS plumbing (dbus alias)
  - unit: dbus-org.freedesktop.network1.service
    reason: OS plumbing (dbus alias)
  - unit: dbus-org.freedesktop.resolve1.service
    reason: OS plumbing (dbus alias)

# ── Sandboxing (alpha-engine-config-I4490) ────────────────────────────────
# Applied uniformly by install-resource-limits.sh to every unit above:
#
#   NoNewPrivileges=yes       no privilege escalation via setuid/fscaps
#   PrivateTmp=yes            per-service /tmp namespace
#   ProtectSystem=full        /usr, /boot, /efi, /etc read-only
#   ProtectKernelTunables=yes /proc/sys, /sys read-only
#   ProtectKernelModules=yes  no module (un)loading
#   ProtectControlGroups=yes  /sys/fs/cgroup read-only
#   RestrictSUIDSGID=yes      cannot create setuid/setgid files
#
# THREE SETTINGS DELIBERATELY NOT USED, each of which would break this box
# ------------------------------------------------------------------------
# `ProtectHome=` — NOT SET. Every service on this box runs FROM
#   /home/ec2-user/<repo> (verified 2026-07-27: WorkingDirectory is
#   /home/ec2-user/... for all of dashboard, metron-api, mnemon, vires, signal,
#   telos-web, nousergon-auth). Any ProtectHome= value makes /home invisible or
#   read-only and breaks all thirteen simultaneously. I4490's own issue body
#   suggested `ProtectHome=read-only`; that was wrong for this box.
#
# `ProtectSystem=strict` — NOT USED, `full` instead. `strict` makes the ENTIRE
#   filesystem hierarchy read-only, /home included, so every service would need
#   its own ReadWritePaths= for its checkout, venv, and any local SQLite. That
#   is per-service work with a real breakage surface; `full` protects /usr,
#   /boot, /efi and /etc while leaving /home writable, which is where the whole
#   attack surface of a shared-user box actually is. I4490's issue body
#   suggested `strict`; downgraded deliberately, not by omission.
#
# `RemoveIPC=` — NOT SET, and this one is a genuine hazard here. It removes ALL
#   IPC objects owned by the user when the unit stops. With thirteen services
#   sharing the single ec2-user identity, stopping one service could destroy
#   IPC belonging to the other twelve. Safe only once services have per-service
#   users.
#
# THE DEEPER FIX — PER-SERVICE USERS (alpha-engine-config#4791)
# ---------------------------------------------------------------
# Sandboxing narrows what a service can reach; it does not change the fact that
# all thirteen share one Unix identity and therefore one set of credentials.
# Per-service system users (declared via the `user:` field on each service
# above) are the real fix, generated as `User=svc-<name>` into the drop-in by
# install-resource-limits.sh. Two companion deliverables complete the arc:
#
#   1. create-service-users.sh — creates the system users, migrates ownership
#      of checkouts / venvs / state directories, and verifies each service
#      starts under its new identity. Run ONCE on the live box.
#   2. RemoveIPC=yes — now safe because each service has its own user, so
#      stopping one cannot destroy another's IPC. Generated conditionally by
#      install-resource-limits.sh: enabled when `user:` is set, omitted for
#      nginx (which has no `user:` field and runs as its own user already).
#
# Until create-service-users.sh executes on the live box, the `user:` fields
# are DECLARED but not yet applied — install-resource-limits.sh will generate
# the User= directive, but the actual users and migrated ownership must exist
# on the box or the service will fail to start.
