# Dashboard box — box-level memory budget and restart semantics.
#
# WHY THIS FILE EXISTS, AND WHY IT LIVES IN THIS REPO
# ---------------------------------------------------
# This box runs 14 long-running services across eight products (alpha-engine,
# metron, telos, vires, the-cyphering, mnemon, nousergon-auth, plus dev
# infrastructure). Most of those services are OWNED by other repos.
#
# The memory budget is nonetheless a property of the BOX, not of any one app,
# because the invariant is about the SUM. No single app repo can enforce
# "everything fits in RAM" — only the repo that owns the box's infrastructure
# can, and that is this one (it already owns nginx.conf, box_health.sh,
# boot-pull.sh, all of which are similarly cross-product).
#
# THE TWO INVARIANTS
# ------------------
#   sum(memory_max_mb) <= ceiling * max_overcommit_ratio    (bounded overcommit)
#   sum(observed_mb)   <= RAM_MB * max_steady_state_fraction (steady-state safety)
#
# where ceiling = RAM_MB * (1 - reserve_fraction). See the overcommit note below
# for why the first bound is a ratio rather than 1.0.
#
# Per-service caps bound ONE runaway. They do nothing about several services
# growing toward their individually-legal ceilings at once — the kernel OOM
# killer then fires against whatever it picks, which need not be the service
# that caused the pressure. That is exactly what happened on 2026-07-25
# (metron-refresh OOM-killed while doing legitimate work) and again on
# 2026-07-27, when the sum stood at ~4650 MB against 1913 MB of RAM (2.4x)
# and the box cascaded: MemAvailable hit 44 MB, metron-dash stopped answering,
# and the SSM agent was starved badly enough that the box could not be managed
# remotely at all.
#
# Enforced by `infrastructure/check_memory_budget.py`, which is run by
# `box_health.sh` and can be run in CI.
#
# Governing policy: nous-ergon-ops/policies/shared-application-host-policy.md
#   T1-1 (aggregate limits <= RAM), T1-2 (uniform restart semantics),
#   T1-7 (right-sized instance).

ram_mb: 3839              # t3.medium, as reported by `free -m` total
reserve_fraction: 0.15    # kernel + page cache headroom => ceiling 3263 MB

# THE OVERCOMMIT RATIO IS DELIBERATE, MEASURED, AND BOUNDED
# ---------------------------------------------------------
# Caps must be sized for each service's STARTUP PEAK, not its steady state.
# Two services on this box proved that painfully on 2026-07-27:
#
#   litellm-proxy    at 150M/300M could never cold-start at all -- importing
#                    litellm's dependency tree exceeded the cap, so the unit
#                    reported active while never binding :8980.
#   llm-egress-proxy at 50M/100M throttled 11385 times with ~60% memory stall;
#                    a single `ssm get-parameter` hung for >113s. It shells out
#                    to the AWS CLI 5x (~150M peak each) during startup.
#
# Sizing every cap for its startup peak makes the SUM exceed the ceiling. That
# is acceptable here and is NOT the same defect as the 2.4x accidental
# overcommit that cascaded the box, because startup peaks DO NOT COINCIDE --
# services cold-start serially, not simultaneously (the one exception is boot,
# where systemd's own ordering staggers them).
#
# What actually governs steady-state safety is the observed sum, tracked
# separately below. Both bounds are enforced by check_memory_budget.py.
#
# Policy section 5 T1-1 permits this explicitly: "Overcommit is permitted only
# as a documented, ratio-stated decision." This is that statement.
max_overcommit_ratio: 1.20      # sum(memory_max) / ceiling. Currently 1.18.
max_steady_state_fraction: 0.60 # sum(observed_mb) / RAM. Currently 0.43.

# memory_high is the SOFT limit: the kernel throttles and reclaims against the
# service rather than killing it. memory_max is the HARD cap. Setting high at
# ~70% of max gives every service a reclaim window before it hits the wall —
# a service with only a hard cap goes from unconstrained straight to a kill.
#
# observed_mb is steady-state RSS measured 2026-07-27 ~11 min after a clean
# boot on t3.medium. Caps are sized for each service's STARTUP PEAK, which for
# most units is ~2-3x observed but for the two proxies is far more (see their
# notes). Re-measure and re-budget when the service set or instance type
# changes; a unit whose note says DO NOT LOWER was calibrated against a real
# failure, and lowering it reproduces that failure.

services:
  # ── alpha-engine ────────────────────────────────────────────────────────
  - unit: dashboard.service
    port: 8501
    observed_mb: 82
    memory_high: 210M
    memory_max: 300M
    note: Streamlit private console; spikes on large dataframe renders

  - unit: nous-ergon-live.service
    port: 8502
    observed_mb: 72
    memory_high: 175M
    memory_max: 250M

  - unit: crucible-dash-api.service
    port: 8506
    observed_mb: 195
    memory_high: 245M
    memory_max: 350M

  - unit: crucible-dash-web.service
    port: 3002
    observed_mb: 113
    memory_high: 154M
    memory_max: 220M

  # ── metron ──────────────────────────────────────────────────────────────
  - unit: metron-api.service
    port: 8000
    observed_mb: 349
    memory_high: 385M
    memory_max: 550M
    note: largest steady-state consumer on the box (gunicorn + uvicorn workers)

  - unit: metron-dash-web.service
    port: 3003
    observed_mb: 104
    memory_high: 154M
    memory_max: 220M

  # ── other products ──────────────────────────────────────────────────────
  - unit: telos-web.service
    port: 3001
    observed_mb: 57
    memory_high: 105M
    memory_max: 150M

  - unit: vires.service
    port: 8530
    observed_mb: 79
    memory_high: 112M
    memory_max: 160M

  - unit: signal.service
    port: 8505
    observed_mb: 78
    memory_high: 175M
    memory_max: 250M

  - unit: mnemon.service
    port: 8503
    observed_mb: 109
    memory_high: 175M
    memory_max: 250M
    note: >
      Was capped at 150M with MemoryHigh=infinity — 109M observed against a
      150M hard cap and no soft limit at all, i.e. closest to its ceiling of
      any service on the box while having no reclaim window. Raised.

  - unit: nousergon-auth.service
    port: 4100
    observed_mb: 51
    memory_high: 105M
    memory_max: 150M
    note: >
      Shared identity service. Found DISABLED (not enabled at boot) on
      2026-07-27 — it was running only because someone had started it by hand,
      and it did not survive the first reboot. Enabled since.

  # ── dev infrastructure ──────────────────────────────────────────────────
  - unit: litellm-proxy.service
    port: 8980
    observed_mb: 308
    memory_high: 350M
    memory_max: 500M
    note: >
      DO NOT LOWER without re-testing a cold start. Calibrated 2026-07-27
      (alpha-engine-config-I4441/I4451): at 150M/300M this unit could never
      cold-start — importing litellm's dependency tree exceeded the cap, the
      cgroup throttled continuously, and the service reported active while
      never binding :8980. Steady state 308M; the gap between that and 500M is
      startup headroom, not slack. Separately has known memory growth (I4441);
      Restart=always now recycles it on an OOM kill instead of letting it die.

  - unit: llm-egress-proxy.service
    port: 8990
    observed_mb: 42
    memory_high: 250M
    memory_max: 400M
    note: >
      DO NOT LOWER — steady state (42M) is wildly unrepresentative of startup.
      Calibrated 2026-07-27 (alpha-engine-config-I4451): at 50M/100M the cgroup
      throttled 11385 times with ~60% memory stall and a single
      `ssm get-parameter` hung for >113s, so the service never finished booting.
      Startup shells out to the AWS CLI 5x (~150M peak each) to resolve provider
      keys, then runs gitleaks subprocesses per scan. The 6x gap between
      observed and cap is entirely startup and subprocess spikes.

  # ── ingress ─────────────────────────────────────────────────────────────
  - unit: nginx.service
    port: 443
    observed_mb: 6
    memory_high: 70M
    memory_max: 100M
    note: sole ingress for all ten vhosts — Restart=always is load-bearing

# Restart semantics applied uniformly to every unit above (policy T1-2).
#
# `Restart=always` IS the restart-on-OOM mechanism. There is no
# `OOMPolicy=restart` -- systemd.service(5) takes only `continue`, `stop`, or
# `kill`, and an invalid value is SILENTLY IGNORED (systemd falls back to the
# default and logs nothing at the unit level). Verified live on systemd 252:
# a drop-in carrying `OOMPolicy=restart` left `systemctl show -p OOMPolicy`
# reporting `stop`, while `Restart=` and `MemoryMax=` from the same block
# applied normally. Anything that "looks applied" here must be read back from
# `systemctl show`, never assumed from the file on disk.
#
# The working combination is:
#   OOMPolicy=stop   -> on an OOM kill systemd terminates the unit cleanly,
#                       stopping its remaining processes rather than letting a
#                       multi-process unit limp on with a dead worker (which is
#                       what `continue` would do).
#   Restart=always   -> systemd then restarts it 5s later, because `always`
#                       restarts on ANY stop, including that clean termination.
#
# CORRECTION to the original I4491 analysis: `OOMPolicy=stop` was NOT the
# mechanism that kept metron-refresh dead for two days. `stop` is systemd's
# default and is correct here. metron-refresh is `Type=oneshot`, `static`, and
# timer-triggered -- a failed oneshot batch job legitimately does not restart.
# Its real defects were that nothing ALERTED on the failure and that its timer
# went inactive; both are tracked in I4487, not fixed by restart semantics.
#
# StartLimitBurst bounds the loop: a genuinely broken service still lands in
# `failed` after 5 restarts in 300s, where box_health.sh sees it. Restart=always
# without a limit is its own failure mode.
restart_policy:
  Restart: always
  RestartSec: 5s
  OOMPolicy: stop
  StartLimitIntervalSec: 300      # [Unit] section
  StartLimitBurst: 5              # [Unit] section

# Units that are legitimately NOT under box_health.sh coverage. The watchdog's
# coverage self-check reports any enabled, non-oneshot unit that is neither in
# `services:` above nor excluded here — so a new app service surfaces as an
# alert instead of going quietly unmonitored, while OS plumbing stays quiet.
#
# Exclusions are BY NAME WITH A REASON. A bare count cannot say what is
# missing, and a count-based check false-alarmed on exactly these units when
# first deployed 2026-07-27.
# ── Timer dead-man thresholds (alpha-engine-config-I5209) ─────────────────
#
# WHY A DECLARED THRESHOLD AND NOT AN INFERRED ONE
# ------------------------------------------------
# box_health.sh's scheduler-state check (classify_timer) answers "is this timer
# scheduled to fire?" It CANNOT answer "did it actually do its job?" — a timer
# whose service exits 1 on every single run is `active`, `waiting`, with a
# perfectly valid next elapse. That is the more common silent failure, and it
# needs an execution-outcome check with a per-job staleness budget.
#
# The budget is declared here rather than derived from the unit's own
# `OnCalendar=`/`OnUnitActiveSec=` on purpose. Acceptable staleness is a
# product decision, not a restatement of the schedule: a weekly bakeoff
# tolerates eight days of silence, a nightly NAV snapshot does not tolerate
# twenty-six hours. More importantly, inferring the threshold FROM the schedule
# silently re-derives the wrong threshold in exactly the case where the
# schedule is the thing that broke.
#
# HOW TO SET ONE
# --------------
# Start at 2x the nominal interval, then widen for real-world gaps the interval
# does not express: randomized delay, weekday-only schedules crossing a
# weekend, multi-fire retry ladders. Every value below is the observed cadence
# from the live box on 2026-07-28, widened for those, and each carries the
# reasoning as a `note:` — a bare number here is unreviewable.
#
# COVERAGE IS TOTAL, DELIBERATELY. Every enabled timer on the box gets a row,
# including OS plumbing. box_health.sh NAMES any enabled timer with no row, so
# a timer added without one surfaces as an alert rather than going quietly
# unmonitored — the same rule `services:` lives under. OS timers are not exempt
# because their failures are not cosmetic on this box: logrotate and fstrim
# guard a 32 GB root volume, dnf-automatic is the T1-5 patching cadence.
timers:
  # ── alpha-engine ────────────────────────────────────────────────────────
  - unit: box-health.timer
    max_staleness: 30m
    note: every 10min; 3x covers one missed tick plus a slow confirm window
  - unit: emit-oom-metric.timer
    max_staleness: 20m
    note: every 5min; the OOM counter feeding the T0-3 saturation alarms
  - unit: boot-pull.timer
    max_staleness: 26h
    note: daily 12:00 UTC + up to 5min randomized delay
  - unit: box-hygiene.timer
    max_staleness: 8d
    note: weekly Sun 09:20 UTC; one full missed week is the signal
  - unit: reboot-if-needed.timer
    max_staleness: 8d
    note: weekly Sun 07:00 UTC. Persistent=false, so a box down at 07:00 skips
          the week entirely — 8d catches the second consecutive skip
  - unit: substrate-health-daily.timer
    max_staleness: 4d
    note: Mon-Fri 22:30 UTC; Fri->Mon is a 3-day gap by design
  - unit: systemd-unit-drift-check.timer
    max_staleness: 26h
    note: daily 06:17 UTC + up to 5min randomized delay

  # ── metron ──────────────────────────────────────────────────────────────
  - unit: metron-refresh.timer
    max_staleness: 26h
    note: three same-evening fires (20:45/21:30/22:30 UTC) are ONE nightly job
          with a retry ladder, so the real cadence is daily, not 3x daily.
          This is the job whose 2026-07-25 OOM kill went unnoticed for two days
  - unit: metron-refresh-flex.timer
    max_staleness: 4d
    note: Mon-Fri 13:15 UTC; Fri->Mon is a 3-day gap by design

  # ── morning-signal / the-cyphering ──────────────────────────────────────
  - unit: morning-signal.timer
    max_staleness: 26h
    note: daily 04:00 America/Los_Angeles; DST shifts the UTC hour, not the gap
  - unit: morning-signal-watchdog.timer
    max_staleness: 26h
    note: daily 06:15 America/Los_Angeles
  - unit: morning-signal-bakeoff.timer
    max_staleness: 8d
    note: weekly Wed 05:00 America/Los_Angeles
  - unit: daily-news.timer
    max_staleness: 26h
    note: daily 04:00 America/Los_Angeles
  - unit: signal-pull.timer
    max_staleness: 26h
    note: daily 15:10 UTC

  # ── mnemon ──────────────────────────────────────────────────────────────
  - unit: mnemon-sync.timer
    max_staleness: 45m
    note: every 15min; 3x absorbs one slow sync plus one missed tick

  # ── OS plumbing (covered, not exempt — see the note above) ──────────────
  - unit: logrotate.timer
    max_staleness: 26h
    note: daily; guards the 32 GB root volume against journal/log growth
  - unit: dnf-automatic.timer
    max_staleness: 27h
    note: daily 06:00 + up to 60min randomized delay; the T1-5 patch cadence
  - unit: fstrim.timer
    max_staleness: 9d
    note: weekly + up to 100min randomized delay
  - unit: sysstat-collect.timer
    max_staleness: 30m
    note: every 10min at :00/10
  - unit: sysstat-summary.timer
    max_staleness: 26h
    note: daily 00:07
  - unit: systemd-tmpfiles-clean.timer
    max_staleness: 30h
    note: OnUnitActiveSec=1d, so it drifts later each day rather than pinning
          to a wall-clock hour
  - unit: update-motd.timer
    max_staleness: 30h
    note: OnUnitActiveSec=720min PLUS RandomizedDelaySec=720min, so the real
          interval is 12-24h — 2x the nominal 12h would false-alarm

manifest_exclude:
  - unit: "alert-on-failure@.service"
    reason: systemd template unit, never instantiated directly
  - unit: amazon-cloudwatch-agent.service
    reason: AWS agent, has its own supervision and its own alarms
  - unit: dbus.service
    reason: OS plumbing
  - unit: dbus-org.freedesktop.home1.service
    reason: OS plumbing (dbus alias)
  - unit: dbus-org.freedesktop.network1.service
    reason: OS plumbing (dbus alias)
  - unit: dbus-org.freedesktop.resolve1.service
    reason: OS plumbing (dbus alias)

# ── Sandboxing (alpha-engine-config-I4490) ────────────────────────────────
# Applied uniformly by install-resource-limits.sh to every unit above:
#
#   NoNewPrivileges=yes       no privilege escalation via setuid/fscaps
#   PrivateTmp=yes            per-service /tmp namespace
#   ProtectSystem=full        /usr, /boot, /efi, /etc read-only
#   ProtectKernelTunables=yes /proc/sys, /sys read-only
#   ProtectKernelModules=yes  no module (un)loading
#   ProtectControlGroups=yes  /sys/fs/cgroup read-only
#   RestrictSUIDSGID=yes      cannot create setuid/setgid files
#
# THREE SETTINGS DELIBERATELY NOT USED, each of which would break this box
# ------------------------------------------------------------------------
# `ProtectHome=` — NOT SET. Every service on this box runs FROM
#   /home/ec2-user/<repo> (verified 2026-07-27: WorkingDirectory is
#   /home/ec2-user/... for all of dashboard, metron-api, mnemon, vires, signal,
#   telos-web, nousergon-auth). Any ProtectHome= value makes /home invisible or
#   read-only and breaks all thirteen simultaneously. I4490's own issue body
#   suggested `ProtectHome=read-only`; that was wrong for this box.
#
# `ProtectSystem=strict` — NOT USED, `full` instead. `strict` makes the ENTIRE
#   filesystem hierarchy read-only, /home included, so every service would need
#   its own ReadWritePaths= for its checkout, venv, and any local SQLite. That
#   is per-service work with a real breakage surface; `full` protects /usr,
#   /boot, /efi and /etc while leaving /home writable, which is where the whole
#   attack surface of a shared-user box actually is. I4490's issue body
#   suggested `strict`; downgraded deliberately, not by omission.
#
# `RemoveIPC=` — NOT SET, and this one is a genuine hazard here. It removes ALL
#   IPC objects owned by the user when the unit stops. With thirteen services
#   sharing the single ec2-user identity, stopping one service could destroy
#   IPC belonging to the other twelve. Safe only once services have per-service
#   users.
#
# THE DEEPER FIX, NOT DONE HERE
# ----------------------------- 
# Sandboxing narrows what a service can reach; it does not change the fact that
# all thirteen share one Unix identity and therefore one set of credentials.
# Per-service system users (User=svc-metron, svc-mnemon, ...) with per-service
# home directories are the real fix, and they need a file-ownership migration
# per service. Tracked separately rather than bundled here.
