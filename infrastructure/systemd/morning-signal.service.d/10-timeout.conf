# TimeoutStartSec=600 killed the 2026-08-08 weekend edition mid-TTS: the
# episode had just finished a 9m34s generation pass and was 23s into
# splitting 6 TTS chunks. The 10-minute budget was sized when generation
# took ~2min; it has no headroom for a slow-but-succeeding run, and a
# timeout here destroys a completed script rather than delaying it.
# The freshness watchdog (13:15 UTC) remains the real upper bound.
[Service]
TimeoutStartSec=2700
