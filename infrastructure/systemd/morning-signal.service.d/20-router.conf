# Router-edge addressing for the primary generation spec (alpha-engine-config-I6567).
#
# The four variables themselves live in ONE place —
# `systemd/morning-signal-router-env.conf`, installed to
# /etc/morning-signal/router-env.conf — because three processes need the same
# contract: this unit, `morning-signal-bakeoff.service`, and
# `morning-signal-recover.sh`. They were three separate copies until
# 2026-08-12, and the bakeoff's copy did not exist at all.
#
# Read that file for what each variable is for and why the edge URL is
# load-bearing.
[Service]
EnvironmentFile=/etc/morning-signal/router-env.conf
