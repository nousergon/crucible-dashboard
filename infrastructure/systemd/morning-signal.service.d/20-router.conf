# Router-edge addressing for the primary generation spec (alpha-engine-config-I6567).
#
# KREPIS_EXEC_CONTEXT is DECLARED, never inferred (model-router-policy R29):
# the resolver must not read a hostname or the metadata service to decide
# which registry entries can serve this caller.
#
# LLM_MODEL_REGISTRY_PATH is required because krepis resolves a group from the
# registry by walking up for a private-docs/ directory, and this unit runs from
# /home/ec2-user/morning-signal, which has none.
#
# KREPIS_ROUTER_CREDENTIAL_SECRET names THIS consumer credential; the edge
# identifies each consumer by its credential value, so a shared one would
# collapse every consumer into one identity.
[Service]
Environment="KREPIS_EXEC_CONTEXT=ec2"
Environment="LLM_MODEL_REGISTRY_PATH=/home/ec2-user/alpha-engine-config/private-docs/LLM_MODEL_REGISTRY.yaml"
Environment="KREPIS_ROUTER_CREDENTIAL_SECRET=ROUTER_CONSUMER_MORNINGSIGNAL"
