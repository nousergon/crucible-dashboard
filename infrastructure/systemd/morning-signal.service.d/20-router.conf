# Router-edge addressing for the primary generation spec (alpha-engine-config-I6567).
#
# KREPIS_EXEC_CONTEXT is DECLARED, never inferred (model-router-policy R29):
# the resolver must not read a hostname or the metadata service to decide
# which registry entries can serve this caller.
#
# LLM_MODEL_REGISTRY_PATH is required because krepis resolves a group from the
# registry by walking up for a private-docs/ directory, and this unit runs from
# /home/ec2-user/morning-signal, which has none.
#
# KREPIS_ROUTER_CREDENTIAL_SECRET names THIS consumer credential; the edge
# identifies each consumer by its credential value, so a shared one would
# collapse every consumer into one identity.
#
# KREPIS_LITELLM_PROXY_URL IS WHAT MAKES THE LINE ABOVE TRUE.
# krepis defaults the litellm_proxy route to http://127.0.0.1:8980 — the
# router PROCESS, not the authenticating nginx edge in front of it. A
# co-tenant consumer may address loopback (model-router-policy R27d), but the
# per-consumer credential is meaningful only AT the edge, which is what
# translates it into the router's own key; the process behind it knows the
# master key and nothing else, and has no database in which to look a virtual
# key up (`/health/readiness` reports `db: Not connected`). So the default URL
# and this consumer's credential are a `(url, credential)` pair that cannot
# authenticate, and the router answers every call:
#
#   400 {"error":{"message":"No connected db.","type":"no_db_connection"}}
#
# Measured on the box: EVERY scheduled run from 2026-08-09 through 2026-08-12
# aborted its configured primary on that 400 and aired the episode on a
# fallback — on 08-11 and 08-12 the OpenRouter fallback failed too and the
# episode came from the Anthropic last-resort attempt. Nothing alerted,
# because a 400 is not one of the exception types morning-signal classifies
# as deployment-class (morning-signal-PR<ms> fixes that half).
#
# https://router.nousergon.ai:8443 is the fleet standard for this variable —
# the Think Tank spot dispatcher asserts both that it exports exactly this URL
# and that it never exports a 127.0.0.1 one
# (nousergon-data .../thinktank-spot-dispatcher/test_handler.py).
[Service]
Environment="KREPIS_EXEC_CONTEXT=ec2"
Environment="LLM_MODEL_REGISTRY_PATH=/home/ec2-user/alpha-engine-config/private-docs/LLM_MODEL_REGISTRY.yaml"
Environment="KREPIS_ROUTER_CREDENTIAL_SECRET=ROUTER_CONSUMER_MORNINGSIGNAL"
Environment="KREPIS_LITELLM_PROXY_URL=https://router.nousergon.ai:8443"
