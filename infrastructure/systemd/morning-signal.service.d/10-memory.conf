[Service]
# Derived from measurement, 2026-08-14 (alpha-engine-config-I5546).
#
# 600M/900M were never measured — 900M was the largest single claim on this
# box's timer-job headroom and nothing behind it. 30-record-peak.conf was
# installed to fix that by logging every run's cgroup peak; six runs are now on
# record in /home/ec2-user/.morning-signal-peak.log, all `result=success`:
#
#   2026-08-09   72 MiB      2026-08-12  224 MiB   <- max
#   2026-08-10  158 MiB      2026-08-12   71 MiB
#   2026-08-11  206 MiB      2026-08-13  204 MiB
#
# 530M is 2.4x the 224 MiB maximum — the band #662 settled on for this box, and
# the same multiple check_memory_budget.py's proposal loop derives, so this
# number will not be re-argued from a different rule next month. MemoryHigh at
# 370M keeps the ~70% reclaim window.
#
# Sized on the MAXIMUM, never the mean: the two ~72 MiB runs are short episodes,
# and a cap fitted to the average would OOM the full-episode-plus-TTS path that
# produces the 224. The trend across the four full runs is upward
# (158 -> 206 -> 224), which 530M leaves real room above; 30-record-peak.conf
# keeps logging, so a run that ever approaches it is visible before it is fatal.
MemoryAccounting=yes
MemoryHigh=370M
MemoryMax=530M
