# Record the run's cgroup peak RSS after every execution (alpha-engine-config-I5546).
# The 600M/900M caps in 10-memory.conf were never derived from a measurement —
# shared-application-host-policy §4.3 requires the footprint measured, and 900M is
# the largest single claim on the box's timer-job headroom. This appends one line
# per run; re-derive the caps once >=3 real runs (full episode + TTS) are logged:
# MemoryHigh ~= 1.3-1.5x peak, MemoryMax ~= 1.8-2x peak, sized clear of the peak.
#
# ExecStopPost processes run inside the unit's own cgroup before it is torn down,
# so memory.peak (cgroup v2, kernel >= 5.19) is still readable and includes the
# whole run. SERVICE_RESULT distinguishes a clean run's peak from a killed one's.
[Service]
ExecStopPost=/bin/sh -c 'p=/sys/fs/cgroup/system.slice/%N.service/memory.peak; if [ -r "$$p" ]; then printf "%%s peak_bytes=%%s result=%%s\n" "$$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)" "$$(cat "$$p")" "$${SERVICE_RESULT:-na}" >> /home/ec2-user/.morning-signal-peak.log; fi'
