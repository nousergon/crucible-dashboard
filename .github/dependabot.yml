# Standard fleet Dependabot config (weekly, grouped minor+patch) — alpha-engine-config-I2525
# Majors are surfaced as ONE grouped PR per ecosystem, throttled by a 30-day
# major-version cooldown — alpha-engine-config-I2734. NOTE: Dependabot requires a
# unique (package-ecosystem, directory, target-branch) per update config, so the
# I2734 intent CANNOT be a second per-ecosystem block on its own monthly schedule
# (that shape is invalid and disables ALL updates for the repo). The `majors`
# group + `cooldown.semver-major-days: 30` below is the closest legal expression.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
    ignore:
      # krepis 0.59.15+ makes `krepis.session_dlp` shell out to a `gitleaks`
      # binary and FAIL CLOSED without it (alpha-engine-config-I7634). The
      # shared application box has no gitleaks and `deploy-on-merge.sh`
      # installs straight from this repo's lockfile, so a bump past the
      # ceiling arms a DLP hook the box cannot satisfy -- surfacing as an LLM
      # failure naming a scanner, never as a pin problem.
      #
      # `requirements.in` already carries the constraint
      # (`krepis[openai]>=0.59.14,<0.59.15`), but Dependabot resolves against
      # `requirements.txt` and does not read the `.in`, so it proposed
      # 0.59.25 in the minor-and-patch group on 2026-08-21 (#722). That PR
      # went red on BOTH sides of the ceiling at once:
      # `test_krepis_pin_spans_spot_evidence_below_gitleaks` caught the pin,
      # and `test_morning_brief_consumer` failed with "DLP scan blocked
      # outbound request: gitleaks binary not found on PATH -- failing
      # closed", which is the outage the ceiling exists to prevent, observed
      # in CI. Without this ignore, Dependabot re-proposes the same unsafe
      # bump every week and reddens the whole grouped PR with it, blocking
      # the five safe bumps riding along.
      #
      # LIFT THIS TOGETHER WITH THE CEILING, NOT BEFORE: when I7634 provisions
      # gitleaks on the box AND adds it to the provisioning the box is rebuilt
      # from, delete this entry, the `<0.59.15` bound in requirements.in, and
      # the ceiling assertion in
      # tests/test_krepis_pin_spans_spot_evidence_below_gitleaks.py in one PR.
      # The floor (0.59.13, `krepis.spot_evidence`) is NOT removable and this
      # ignore deliberately does not touch it -- versions between the floor
      # and the ceiling are still proposed normally.
      - dependency-name: "krepis"
        versions: [">=0.59.15"]

  - package-ecosystem: npm
    directories:
      - "/dash-web"
      - "/marketing"
      - "/marketing-apex"
      - "/marketing-dev"
      - "/marketing-finance"
      - "/marketing-metron"
      - "/marketing-telos"
      - "/marketing-vires"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
    ignore:
      # @astrojs/check (latest 0.9.9) peers on typescript "^5 || ^6"; a TS
      # semver-major (7.x) breaks `npm ci` with ERESOLVE across the Astro
      # marketing sites (marketing-metron/#431 + marketing-telos/#432 both
      # reddened main-branch marketing-ci, 2026-07-16). Hold TypeScript on
      # 6.x until @astrojs/check ships TS7 peer support, then lift this.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # next 16 (already merged onto dash-web, #460) required Node >=20.9;
      # the dash-web deploy box's Node major was not pinned to any single
      # source of truth, so a Dependabot major that's green in CI (GitHub-
      # hosted runner) could still silently fail the separate on-box `next
      # build` at deploy time (config#2711 — exactly what happened with
      # #460). dash-web/.nvmrc is now that source of truth (parity target:
      # Node 22) and infrastructure/deploy-on-merge.sh fails loud on
      # mismatch, but a FUTURE next major can still need a newer Node major
      # than the box has — hold future next majors for deliberate review
      # rather than auto-merging.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  # NOTE: no cooldown here — Dependabot rejects cooldown.semver-major-days for
  # the github-actions ecosystem (semver cooldown keys are per-ecosystem; pip
  # supports them, actions does not — validated live 2026-07-16). The majors
  # group alone carries the I2734 grouping intent for actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
