# Standard fleet Dependabot config (weekly, grouped minor+patch) — alpha-engine-config-I2525
# Majors are surfaced as ONE grouped PR per ecosystem, throttled by a 30-day
# major-version cooldown — alpha-engine-config-I2734. NOTE: Dependabot requires a
# unique (package-ecosystem, directory, target-branch) per update config, so the
# I2734 intent CANNOT be a second per-ecosystem block on its own monthly schedule
# (that shape is invalid and disables ALL updates for the repo). The `majors`
# group + `cooldown.semver-major-days: 30` below is the closest legal expression.
version: 2
#
# THE PIP ECOSYSTEM IS DELIBERATELY ABSENT (alpha-engine-config-I9060).
# requirements.txt in this repo is a `uv pip compile` artifact of
# requirements.in. Dependabot edits requirements.txt directly and knows
# nothing about requirements.in, so by construction every pip PR it opened
# arrived red on `lockfile-reproducible`:
#
#   FAIL: requirements.txt is not reproducible from requirements.in.
#
# Dependabot PRs are a STANDING auto-merge exception (`auto-merge-policy`); an
# exception whose PRs are structurally incapable of going green never fires,
# so the fleet believed this repo had automated Python dependency maintenance
# and it had none. The human workaround already cost deploys here —
# crucible-dashboard#778 moved requirements.in by hand because "every deploy
# has been failing since #775".
#
# Python dependencies are upgraded by `.github/upgrade_lock.sh` instead — the
# tool that owns the lockfile, running the same compile flags the guard
# verifies against (`.github/lockfile_compile.sh`) — driven weekly by
# nousergon/alpha-engine-config's `lockfile-upgrade-sweep`, which opens the PR
# under the ne-groomer App token so CI actually grades it. Nothing that worked
# is lost: pip-audit still runs on every PR, and it is what catches a
# vulnerable pin.
#
# The npm ecosystem below is UNAFFECTED and stays: package-lock.json is a lock
# npm itself maintains from package.json, and Dependabot moves both together.
updates:
  - package-ecosystem: npm
    directories:
      - "/dash-web"
      - "/marketing"
      - "/marketing-apex"
      - "/marketing-dev"
      - "/marketing-finance"
      - "/marketing-metron"
      - "/marketing-telos"
      - "/marketing-vires"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
    ignore:
      # @astrojs/check (latest 0.9.9) peers on typescript "^5 || ^6"; a TS
      # semver-major (7.x) breaks `npm ci` with ERESOLVE across the Astro
      # marketing sites (marketing-metron/#431 + marketing-telos/#432 both
      # reddened main-branch marketing-ci, 2026-07-16). Hold TypeScript on
      # 6.x until @astrojs/check ships TS7 peer support, then lift this.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # next 16 (already merged onto dash-web, #460) required Node >=20.9;
      # the dash-web deploy box's Node major was not pinned to any single
      # source of truth, so a Dependabot major that's green in CI (GitHub-
      # hosted runner) could still silently fail the separate on-box `next
      # build` at deploy time (config#2711 — exactly what happened with
      # #460). dash-web/.nvmrc is now that source of truth (parity target:
      # Node 22) and infrastructure/deploy-on-merge.sh fails loud on
      # mismatch, but a FUTURE next major can still need a newer Node major
      # than the box has — hold future next majors for deliberate review
      # rather than auto-merging.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  # NOTE: no cooldown here — Dependabot rejects cooldown.semver-major-days for
  # the github-actions ecosystem (semver cooldown keys are per-ecosystem; pip
  # supports them, actions does not — validated live 2026-07-16). The majors
  # group alone carries the I2734 grouping intent for actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
