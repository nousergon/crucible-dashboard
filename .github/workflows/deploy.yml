name: Deploy

# Auto-deploys console.nousergon.ai + nousergon.ai on every push to main.
#
# The streamlit services run from this repo on a single EC2 instance
# (id in the DASHBOARD_INSTANCE_ID repo variable). They do NOT auto-restart on code-only changes —
# boot-pull's daily 12:00-UTC timer only restarts services whose .service
# unit files change. This workflow closes that "merged but stale" gap.
#
# Mechanism: GHA assumes the OIDC role, calls SSM send-command on the
# dashboard instance, which runs infrastructure/deploy-on-merge.sh —
# git fetch + reset to the workflow-pinned SHA, lib refresh, restart
# both streamlit services, health-check both /_stcore/health endpoints.
#
# Boot-pull stays as the daily safety net for ALL repos + drift catch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy dashboard via SSM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Dashboard EC2 instance, sourced from the repo variable (not hardcoded)
      # so the box identifier lives in one place. Set via: gh variable set
      # DASHBOARD_INSTANCE_ID. Non-secret identifier — a variable, not a secret.
      DASHBOARD_INSTANCE_ID: ${{ vars.DASHBOARD_INSTANCE_ID }}
      # Bounded AWS SDK retry for throttling resilience across all alarm puts
      # (config#5518 — a throttled alarm step was skipping the other two).
      AWS_MAX_ATTEMPTS: 5
      AWS_RETRY_MODE: adaptive

    steps:
      # The deploy job historically needed no checkout — it only sends SSM
      # commands, and the box runs scripts from its OWN checkout. It does need
      # one now: the host-alarms step runs infrastructure/install-host-alarms.sh
      # from the runner, because that script cannot run on the box (the instance
      # role deliberately lacks cloudwatch:PutMetricAlarm). Without this the step
      # dies with "No such file or directory" (exit 127), which is exactly how
      # it failed on the config-I5211 merge.
      #
      # Checking out and running the script beats inlining seven put-metric-alarm
      # calls here: the script stays the single definition of those alarms.
      # Duplicating them into the workflow would create precisely the two-copies
      # drift this repo has spent the day removing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Send SSM deploy command
        id: send
        run: |
          set -euo pipefail
          # Two-phase command body:
          #   1. Pull a deterministic ref (the workflow's commit SHA) as
          #      ec2-user — this refreshes the deploy script itself before
          #      we invoke it.
          #   2. Run the freshly-pulled deploy script as root (default
          #      SSM user) so systemctl restart needs no further sudo.
          #
          # Pinning to GITHUB_SHA (not origin/main) guards against a
          # back-to-back merge racing this deploy.
          # The deploy runs in its OWN transient cgroup (alpha-engine-config-I7298).
          #
          # Without the scope, everything below executes inside
          # amazon-ssm-agent.service's cgroup, because that is what delivers
          # the command. Measured 2026-08-14: that cgroup carried a 1689 MB
          # peak against 34 MB of the agent's own anon — the peak was the
          # build. Two consequences, both bad: the largest memory event on the
          # box sat outside budget.yaml entirely, and it could not be capped
          # there without capping the agent, whose death removes the only
          # remote-management path to a box with SSH closed (I5276).
          #
          # `--scope` runs it as a child in its own transient unit; `--collect`
          # reaps that unit afterwards. NO MemoryMax is set here yet — this
          # change buys the measurement (deploy-on-merge.sh reports the scope's
          # own memory.peak as AlphaEngine/Box deploy_peak_mb on the way out),
          # and the cap gets derived from three or more real readings rather
          # than from the 18-day agent figure, which is not a deploy number.
          #
          # Not fallback-guarded: systemd-run is present on AL2023 (verified on
          # the box), and a silent fallback to the un-scoped path would restore
          # exactly the accounting hole this closes while reporting success.
          CMD_BODY="set -e; cd /home/ec2-user/alpha-engine-dashboard && sudo -u ec2-user git fetch origin --quiet && sudo -u ec2-user git reset --hard ${GITHUB_SHA} --quiet && systemd-run --scope --collect --quiet --unit=dash-deploy-${GITHUB_SHA:0:12} bash infrastructure/deploy-on-merge.sh ${GITHUB_SHA}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids ${DASHBOARD_INSTANCE_ID} \
            --document-name AWS-RunShellScript \
            --comment "alpha-engine-dashboard deploy ${GITHUB_SHA}" \
            --parameters "commands=[\"${CMD_BODY}\"]" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=${CMD_ID}" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: ${CMD_ID}"

      - name: Wait for SSM command to finish
        run: |
          set -uo pipefail
          # The AWS-CLI `ssm wait command-executed` waiter is a FIXED budget of
          # 20 attempts x 5s = 100s, NOT configurable by any flag. The dashboard
          # build on the box crosses ~100s, so the waiter gave up while the
          # command was still InProgress and reported a FALSE-RED on a deploy
          # that actually kept running (and succeeded) on the box
          # (2026-07-16, run 29505183706 — config#2720). Poll for a genuine
          # TERMINAL SSM status instead, bounded by the job's own
          # timeout-minutes, so the workflow's wait is never shorter than the
          # deploy's real runtime. Fail-loud: a terminal Failed/Cancelled/
          # TimedOut, or exhausting the budget without ever reaching terminal,
          # exits non-zero — nothing is made quieter.
          DEADLINE=$(( $(date +%s) + 540 ))   # 9 min, inside timeout-minutes: 10
          while :; do
            # get-command-invocation can briefly 404 (InvocationDoesNotExist)
            # right after send-command; treat any read hiccup as non-terminal.
            STATUS=$(aws ssm get-command-invocation \
              --instance-id ${DASHBOARD_INSTANCE_ID} \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success)
                echo "SSM command reached terminal status: Success"
                exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM command reached terminal status: $STATUS"
                exit 1 ;;
              *)
                : ;;  # Pending / InProgress / Delayed — keep waiting
            esac
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::SSM command did not reach a terminal state within the wait budget (last status: $STATUS)"
              exit 1
            fi
            sleep 5
          done

      - name: Fetch deploy output
        if: always()
        run: |
          set +e
          # StatusDetails + elapsed time make delivery-vs-script failure
          # self-classifying (config#2224): a terminal Failed in <1s with empty
          # output means the command never EXECUTED on the box (SSM agent
          # down / disk full — the config#2227 signature), which no rerun can
          # heal — vs a real deploy-script failure, which the stderr below
          # explains.
          read -r STATUS DETAILS ELAPSED <<< "$(aws ssm get-command-invocation \
            --instance-id ${DASHBOARD_INSTANCE_ID} \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --query '[Status,StatusDetails,ExecutionElapsedTime]' --output text)"
          echo "status=$STATUS details=$DETAILS elapsed=$ELAPSED"
          if [ "$STATUS" = "Failed" ] && printf '%s' "$ELAPSED" | grep -qE '^PT0\.[0-9]+S$'; then
            echo "::error::SSM DELIVERY FAILURE — command never executed on the box (elapsed $ELAPSED, host-side fault: agent down or disk full, config#2227 signature). Rerunning the workflow cannot heal this; fix the instance first."
          fi
          echo "── stdout ──"
          aws ssm get-command-invocation \
            --instance-id ${DASHBOARD_INSTANCE_ID} \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --query 'StandardOutputContent' --output text
          echo "── stderr ──"
          aws ssm get-command-invocation \
            --instance-id ${DASHBOARD_INSTANCE_ID} \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --query 'StandardErrorContent' --output text

      - name: Ensure box disk alarm exists (alarm-as-code, config#2227)
        if: always()
        run: |
          # Idempotent: put-metric-alarm creates or updates in place. Pages the
          # alpha-engine-alerts SNS (Telegram) when the box's root disk crosses
          # 90% — or when the metric GOES MISSING for 3 periods, which catches
          # the box/agent/watchdog being too broken to publish at all (the
          # 2026-07-11 disk-full-killed-SSM class). Metric is published every
          # 10 min by box_health.sh (AlphaEngine/Box namespace).
          aws cloudwatch put-metric-alarm \
            --alarm-name alpha-engine-dashboard-box-disk-critical \
            --alarm-description "Dashboard EC2 root disk >=90% or box health metric missing (config#2227)" \
            --namespace AlphaEngine/Box --metric-name disk_used_percent \
            --dimensions Name=InstanceId,Value=${DASHBOARD_INSTANCE_ID} \
            --statistic Maximum --period 600 \
            --evaluation-periods 3 --datapoints-to-alarm 2 \
            --threshold 90 --comparison-operator GreaterThanOrEqualToThreshold \
            --treat-missing-data breaching \
            --alarm-actions arn:aws:sns:us-east-1:711398986525:alpha-engine-alerts \
            --ok-actions arn:aws:sns:us-east-1:711398986525:alpha-engine-alerts

      - name: Host alarms (alarm-as-code, config-I5211)
        if: always()
        run: |
          # install-host-alarms.sh CANNOT run on the box: the instance role
          # deliberately lacks cloudwatch:PutMetricAlarm, because a host that can
          # rewrite its own alarms can disable its own detection. It ran nowhere
          # at all until now (config-I5215). Here it runs with the OIDC role,
          # whose `alpha-engine-box-alarm-as-code` inline policy is scoped to
          # alarm:alpha-engine-* — the least privilege that makes this possible.
          bash infrastructure/install-host-alarms.sh

      - name: Watchdog-verdict alarm (alarm-as-code, config-I5211)
        if: always()
        run: |
          # The off-box half of the dead-man. box_health.sh publishes its own
          # confirmed-problem COUNT every run, on the metrics path — which is a
          # different code path from the SNS/Telegram alert path, with different
          # failure modes. So a broken alert path (the config#1646 silent-no-op
          # class) still surfaces here.
          #
          # treat-missing-data is notBreaching ON PURPOSE: absent data means the
          # box or the watchdog is down, and that is already covered by
          # box-disk-critical's own missing-data breach above. Two alarms
          # breaching on the same silence would double-page for one cause.
          aws cloudwatch put-metric-alarm \
            --alarm-name alpha-engine-dashboard-health-problems \
            --alarm-description "box_health.sh confirmed >=1 problem it may not have been able to alert about (config-I5211)" \
            --namespace AlphaEngine/Box --metric-name health_problems \
            --dimensions Name=InstanceId,Value=${DASHBOARD_INSTANCE_ID} \
            --statistic Maximum --period 600 \
            --evaluation-periods 2 --datapoints-to-alarm 2 \
            --threshold 1 --comparison-operator GreaterThanOrEqualToThreshold \
            --treat-missing-data notBreaching \
            --alarm-actions arn:aws:sns:us-east-1:711398986525:alpha-engine-alerts \
            --ok-actions arn:aws:sns:us-east-1:711398986525:alpha-engine-alerts

      - name: Append to system-wide deploy changelog
        if: always()
        uses: nousergon/nousergon-docs/.github/actions/append-changelog@765aa682f6c5b7e1e5fc241c7bac1e9e0d6ca326  # main
        with:
          deploy_status: ${{ job.status == 'success' && 'success' || 'failure' }}
          deploy_workflow: deploy.yml

  # Streamlit content-hashed /static/* ESM (PlotlyChart.<hash>.js class,
  # 2026-08-02): after a successful box deploy, best-effort purge the CF edge
  # for console|dashboard|live so a sticky immutable entry cannot outlive the
  # new nginx max-age rewrite. Uses the GHA CLOUDFLARE_API_TOKEN (Pages/Workers
  # grant) — the box SSM token is Access-only and cannot purge (config-I6080).
  # Failures here do NOT fail the deploy: the Worker bypass (nous-ergon-ops
  # streamlit-static-bypass) is the durable edge path; this is the recovery
  # that lands with the merge button alone.
  purge-streamlit-static:
    name: Purge Streamlit static CF cache
    needs: [deploy]
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Purge edge cache + assert Rocket Loader off
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: 6d069b20bf36cfaf5b162abeaac41e38
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret missing — skip purge (config-I6080)"
            exit 0
          fi
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          Z="${CF_ZONE_ID}"

          # Rocket Loader rewrites scripts and breaks ESM dynamic import().
          # Best-effort assert-off; ignore auth errors (narrow token).
          RL=$(curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/zones/${Z}/settings/rocket_loader" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or {}).get("value","unknown"))' || echo unknown)
          echo "rocket_loader=$RL"
          if [ "$RL" = "on" ]; then
            curl -s -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${Z}/settings/rocket_loader" \
              --data '{"value":"off"}' \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print("rocket_loader_patch", d.get("success"), d.get("errors"))' || true
          fi

          chmod +x infrastructure/purge_streamlit_static_cache.sh
          infrastructure/purge_streamlit_static_cache.sh || {
            echo "::warning::purge_streamlit_static_cache.sh exited non-zero — Worker bypass still covers the class"
            exit 0
          }

          # Explicit known-bad chunk from the 2026-08-02 incident (harmless if gone).
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${Z}/purge_cache" \
            --data '{"files":[
              "https://console.nousergon.ai/static/js/PlotlyChart.CylVV9WQ.js",
              "https://dashboard.nousergon.ai/static/js/PlotlyChart.CylVV9WQ.js",
              "https://live.nousergon.ai/static/js/PlotlyChart.CylVV9WQ.js"
            ]}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("plotly_files_purge", d.get("success"), d.get("errors"))' || true

  # Alert (Telegram) on genuine post-merge failure of this workflow on the
  # default branch. Reusable workflow + transport in nousergon-lib. config#1128.
  notify-main-failure:
    needs: [deploy]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@6c4bdb834f0869efc5de3166b285a812053ea709  # main
    secrets: inherit
