name: marketing-ci

# Build + type-check + lint for the Astro static sites: marketing/ (the
# Crucible product site, crucible.nousergon.ai) and marketing-apex/ (the
# Nous Ergon lab landing, nousergon.ai — also builds the Hugo blog into
# its public/). Path-scoped so changes outside the sites don't trigger this
# workflow, and the Python-side dashboard CI doesn't run on site-only
# changes either. Mirrors the "fail-loud" discipline from
# ~/Development/CLAUDE.md item 3 — astro check treats type errors as hard
# failures so they can't ship silently.

on:
  pull_request:
    paths:
      - marketing/**
      - marketing-apex/**
      - marketing-metron/**
      - marketing-vires/**
      - marketing-finance/**
      - marketing-dev/**
      - marketing-telos/**
      - blog/**
      - .github/workflows/marketing-ci.yml
  push:
    branches: [main]
    paths:
      - marketing/**
      - marketing-apex/**
      - marketing-metron/**
      - marketing-vires/**
      - marketing-finance/**
      - marketing-dev/**
      - marketing-telos/**
      - blog/**
      - .github/workflows/marketing-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build + check + lint (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [marketing, marketing-apex, marketing-metron, marketing-vires, marketing-finance, marketing-dev, marketing-telos]
    defaults:
      run:
        working-directory: ${{ matrix.site }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # marketing-apex's build:blog step runs Hugo against blog/themes/PaperMod,
          # a git submodule — without this it's an empty dir at build time (see the
          # matching comment in deploy-marketing.yml for the outage this caused).
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.site }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Format check (Biome)
        run: npm run format:check

      - name: Type check + build (astro check && astro build)
        run: npm run build

      - name: Verify sitemap emitted
        run: |
          test -f dist/sitemap-index.xml \
            || (echo 'sitemap-index.xml not emitted — @astrojs/sitemap regressed' && exit 1)
          test -f dist/robots.txt \
            || (echo 'robots.txt missing from build output' && exit 1)

      # Hugo warns (doesn't fail) when the PaperMod submodule is missing/empty,
      # so astro build succeeds either way — this is the loud check that catches
      # a contentless blog before merge instead of after deploy.
      - name: Verify blog build populated (marketing-apex only)
        if: matrix.site == 'marketing-apex'
        run: |
          test -s dist/blog/index.html \
            || (echo 'dist/blog/index.html missing/empty — Hugo build produced no content (check blog/themes/PaperMod submodule)' && exit 1)
          grep -q 'Nous Ergon' dist/blog/index.html \
            || (echo 'dist/blog/index.html has no theme-rendered content — Hugo likely built with no layouts (empty submodule)' && exit 1)
          test -d dist/blog/posts/introducing-nous-ergon \
            || (echo 'expected blog post directory missing from build output' && exit 1)

  notify-main-failure:
    needs: [build]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@62597e550c08c0b7a7fe0af490cb141e344061b3
    secrets: inherit
