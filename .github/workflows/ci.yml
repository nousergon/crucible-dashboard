name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  dash-web:
    # Crucible /dash Next.js frontend (config#1973 9-C): vitest + typecheck +
    # production build so a TS or build break can't reach the merge deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: dash-web/.nvmrc
          cache: npm
          cache-dependency-path: dash-web/package-lock.json
      - name: Install
        working-directory: dash-web
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: dash-web
        run: npm test
      - name: Typecheck
        working-directory: dash-web
        run: npm run typecheck
      - name: Production build
        working-directory: dash-web
        run: npm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      # The SF definitions this repo's registry-drift guard walks live in
      # nousergon-data. Without them the guard SKIPPED on every runner, so a
      # cross-repo invariant held only on a laptop that happened to have both
      # repos cloned (alpha-engine-config-I7446). Checked out at main, not a
      # pinned SHA: the guard's whole job is to notice when that repo moves.
      - name: Check out SF definitions (nousergon-data)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: nousergon/nousergon-data
          ref: main
          path: .sf-defs
          sparse-checkout: infrastructure
          sparse-checkout-cone-mode: false

      # The champion-gate blocked_by contract this repo's vocabulary-parity
      # guard reads lives in crucible-backtester (both public repos —
      # alpha-engine-config-I7558). Checked out at main, not a pinned SHA:
      # the guard's job is to notice when that contract moves.
      - name: Check out champion-gate contract (crucible-backtester)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: nousergon/crucible-backtester
          ref: main
          path: .backtester-contracts
          sparse-checkout: contracts
          sparse-checkout-cone-mode: false

      - name: Lint (undefined names / unused imports)
        run: ruff check --select F821,F401 .

      - name: Run tests
        env:
          SF_DEFS_DIR: ${{ github.workspace }}/.sf-defs
          BACKTESTER_CONTRACTS_DIR: ${{ github.workspace }}/.backtester-contracts
        run: pytest tests/ -v

      - name: Security audit
        run: |
          pip install pip-audit
          IGNORE_ARGS=()
          if [ -f .github/pip-audit-ignore.txt ]; then
            while IFS= read -r vuln_id; do
              IGNORE_ARGS+=(--ignore-vuln "$vuln_id")
            done < <(grep -vE '^\s*#|^\s*$' .github/pip-audit-ignore.txt)
          fi
          pip-audit "${IGNORE_ARGS[@]}"

  # Lockfile compile-target guard (alpha-engine-config#2791): requirements.txt
  # is a uv-compiled lockfile. Nothing previously verified it was compiled
  # for the SAME Python version the box venv (and this job's `test` above)
  # actually installs it under — a lockfile compiled against a newer
  # interpreter can pin versions with no wheel for the SSoT version, and CI's
  # `pip install` on a matching-version runner won't necessarily catch a
  # resolution that's only reachable via a different compiler pass. This job
  # re-resolves requirements.in with uv, pinned to .python-version, and fails
  # if that resolution can't be installed under the same interpreter — so a
  # lockfile compiled against the wrong Python fails PRE-merge instead of at
  # deploy (the actual defect: config#468's CI was green while the deploy
  # was doomed).
  lockfile-python-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv

      - name: Dry-run install compiled lockfile under SSoT Python
        run: |
          PYVER="$(cat .python-version)"
          echo "Verifying requirements.txt installs cleanly under Python $PYVER"
          uv venv --python "$PYVER" /tmp/lockfile-parity-venv
          uv pip install --python /tmp/lockfile-parity-venv/bin/python -r requirements.txt

  # Alert (Telegram) ONLY on genuine post-merge breakage of the default
  # branch. PR-branch reds (mid-fix commits, cross-repo lib-tag merge-order
  # races) stay silent. Reusable workflow + transport in nousergon-lib.
  # See alpha-engine-config#1128.
  notify-main-failure:
    needs: [test, lockfile-python-parity]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@62597e550c08c0b7a7fe0af490cb141e344061b3
    secrets: inherit
