name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  dash-web:
    # Crucible /dash Next.js frontend (config#1973 9-C): vitest + typecheck +
    # production build so a TS or build break can't reach the merge deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: dash-web/.nvmrc
          cache: npm
          cache-dependency-path: dash-web/package-lock.json
      - name: Install
        working-directory: dash-web
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: dash-web
        run: npm test
      - name: Typecheck
        working-directory: dash-web
        run: npm run typecheck
      - name: Production build
        working-directory: dash-web
        run: npm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install verified gitleaks for the Krepis DLP hook
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 120 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Prove the enabled Krepis DLP scanner accepts a benign request
        run: |
          set -euo pipefail
          mkdir -p .ci/gitleaks
          cat > .ci/gitleaks/gitleaks-egress.toml <<'EOF'
          title = "dashboard-ci-dlp-preflight"
          [extend]
          useDefault = true
          EOF
          KREPIS_GITLEAKS_DIR="$GITHUB_WORKSPACE/.ci/gitleaks" python - <<'PY'
          from krepis.session_dlp import DLP_OK, scan_request

          verdict, reason, _, _ = scan_request(b'{"messages":[{"role":"user","content":"DLP preflight benign"}]}')
          assert verdict == DLP_OK, reason
          PY

      # The SF definitions this repo's registry-drift guard walks live in
      # nousergon-data. Without them the guard SKIPPED on every runner, so a
      # cross-repo invariant held only on a laptop that happened to have both
      # repos cloned (alpha-engine-config-I7446). Checked out at main, not a
      # pinned SHA: the guard's whole job is to notice when that repo moves.
      - name: Check out SF definitions (nousergon-data)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: nousergon/nousergon-data
          ref: main
          path: .sf-defs
          sparse-checkout: infrastructure
          sparse-checkout-cone-mode: false

      # The champion-gate blocked_by contract this repo's vocabulary-parity
      # guard reads is now published in nousergon-lib as the
      # producer_champion_audit contract (alpha-engine-config-I7605) —
      # installed via requirements.txt like any other nousergon-lib
      # contract, so no sibling checkout of crucible-backtester is needed
      # here any more (was: a sparse checkout into .backtester-contracts +
      # BACKTESTER_CONTRACTS_DIR, alpha-engine-config-I7558).

      - name: Lint (undefined names / unused imports)
        run: ruff check --select F821,F401 .

      - name: Run tests
        env:
          SF_DEFS_DIR: ${{ github.workspace }}/.sf-defs
          KREPIS_GITLEAKS_DIR: ${{ github.workspace }}/.ci/gitleaks
        run: pytest tests/ -v

      - name: Security audit
        run: |
          pip install pip-audit
          IGNORE_ARGS=()
          if [ -f .github/pip-audit-ignore.txt ]; then
            while IFS= read -r vuln_id; do
              IGNORE_ARGS+=(--ignore-vuln "$vuln_id")
            done < <(grep -vE '^\s*#|^\s*$' .github/pip-audit-ignore.txt)
          fi
          pip-audit "${IGNORE_ARGS[@]}"

  # Lockfile compile-target guard (alpha-engine-config#2791): requirements.txt
  # is a uv-compiled lockfile. Nothing previously verified it was compiled
  # for the SAME Python version the box venv (and this job's `test` above)
  # actually installs it under — a lockfile compiled against a newer
  # interpreter can pin versions with no wheel for the SSoT version, and CI's
  # `pip install` on a matching-version runner won't necessarily catch a
  # resolution that's only reachable via a different compiler pass. This job
  # re-resolves requirements.in with uv, pinned to .python-version, and fails
  # if that resolution can't be installed under the same interpreter — so a
  # lockfile compiled against the wrong Python fails PRE-merge instead of at
  # deploy (the actual defect: config#468's CI was green while the deploy
  # was doomed).
  #
  # SCOPE, so the name is not read as more than it claims: this job proves the
  # lock RESOLVES AND INSTALLS. It says nothing about whether the lock still
  # corresponds to requirements.in — a floor raised in the .in is invisible
  # here. `lockfile-reproducible` below is the job that owns that claim
  # (alpha-engine-config-I8309).
  lockfile-python-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv

      - name: Dry-run install compiled lockfile under SSoT Python
        run: |
          PYVER="$(cat .python-version)"
          echo "Verifying requirements.txt installs cleanly under Python $PYVER"
          uv venv --python "$PYVER" /tmp/lockfile-parity-venv
          uv pip install --python /tmp/lockfile-parity-venv/bin/python -r requirements.txt

  # Lockfile REPRODUCIBILITY guard (alpha-engine-config-I8309). Distinct from
  # `lockfile-python-parity` above, and strictly stronger: that job proves the
  # committed lock INSTALLS under the SSoT interpreter, which stays green
  # forever while requirements.in drifts away from it. This job re-runs the
  # compile and fails when the lock is not what requirements.in produces.
  #
  # The defect it exists to catch, measured in this repo: crucible-dashboard#739
  # bumped requirements.txt and left requirements.in behind, failing
  # check_package_drift on the box for every deploy from 2026-08-20 22:45 while
  # CI stayed green; and `setuptools>=84.0.0` — declared in requirements.in for
  # the PYSEC-2026-3447 pip-audit gate — was absent from the lock entirely.
  # The sibling instance ran further in crucible-executor (PR493): a lock
  # pinning krepis==0.54.0 against a .in flooring >=0.59.18, with the .in
  # outright unsatisfiable.
  #
  # The compile flags live in the script, with the reasoning for each.
  lockfile-reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv

      - name: requirements.txt is reproducible from requirements.in
        run: bash infrastructure/check_lock_reproducible.sh

  # The PRODUCER side of the lockfile, exercised on every PR
  # (alpha-engine-config-I9060). `.github/upgrade_lock.sh` is what replaced
  # Dependabot's pip ecosystem here, and it runs on a weekly schedule from
  # another repo — so nothing in this repo's own CI would ever have executed
  # it. A producer nobody runs rots into a script that fails on its first real
  # invocation months later, and a workflow that has never once executed is
  # indistinguishable from one that works (alpha-engine-config-I8729).
  #
  # `--check` runs the exact compile the producer runs, writes nothing and
  # opens nothing. It is a SMOKE TEST, not a gate: it is expected to report
  # `changed=true` most weeks (upstream cuts releases), and it fails only when
  # the producer itself is broken — a syntax error, a flag uv no longer
  # accepts, a requirements.in that does not resolve under --upgrade.
  lockfile-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv

      - name: The lockfile producer must run
        run: bash .github/upgrade_lock.sh --check

  # Alert (Telegram) ONLY on genuine post-merge breakage of the default
  # branch. PR-branch reds (mid-fix commits, cross-repo lib-tag merge-order
  # races) stay silent. Reusable workflow + transport in nousergon-lib.
  # See alpha-engine-config#1128.
  notify-main-failure:
    needs: [test, lockfile-python-parity, lockfile-reproducible, lockfile-producer]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@62597e550c08c0b7a7fe0af490cb141e344061b3
    secrets: inherit
